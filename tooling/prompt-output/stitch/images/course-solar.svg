<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 400 320">
  <defs>
    <linearGradient id="skyBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
  </defs>
  <rect fill="url(#skyBlue)" width="400" height="320"/>
  <!-- Large solar panel array -->
  <g transform="translate(20, 120)">
    <!-- Panel row 1 -->
    <rect x="0" y="0" width="170" height="100" fill="#1e3a5f" stroke="#2563eb" stroke-width="2" transform="skewY(-8)"/>
    <g stroke="#2563eb" stroke-width="1.5" transform="skewY(-8)">
      <line x1="42" y1="0" x2="42" y2="100"/>
      <line x1="85" y1="0" x2="85" y2="100"/>
      <line x1="127" y1="0" x2="127" y2="100"/>
      <line x1="0" y1="33" x2="170" y2="33"/>
      <line x1="0" y1="66" x2="170" y2="66"/>
    </g>
    <!-- Panel row 2 -->
    <rect x="190" y="-15" width="170" height="100" fill="#1e3a5f" stroke="#2563eb" stroke-width="2" transform="skewY(-8)"/>
    <g stroke="#2563eb" stroke-width="1.5" transform="skewY(-8)">
      <line x1="232" y1="-15" x2="232" y2="85"/>
      <line x1="275" y1="-15" x2="275" y2="85"/>
      <line x1="317" y1="-15" x2="317" y2="85"/>
      <line x1="190" y1="18" x2="360" y2="18"/>
      <line x1="190" y1="51" x2="360" y2="51"/>
    </g>
  </g>
  <!-- Blueprint/diagram overlay -->
  <rect x="20" y="20" width="140" height="90" fill="white" opacity="0.95" rx="5"/>
  <g transform="translate(30, 30)">
    <rect x="0" y="0" width="50" height="35" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>
    <line x1="16" y1="0" x2="16" y2="35" stroke="#1e3a5f"/>
    <line x1="33" y1="0" x2="33" y2="35" stroke="#1e3a5f"/>
    <line x1="0" y1="17" x2="50" y2="17" stroke="#1e3a5f"/>
    <text x="60" y="15" font-family="sans-serif" font-size="10" fill="#1e3a5f">Panel Layout</text>
    <text x="60" y="30" font-family="sans-serif" font-size="8" fill="#64748b">2.4kW System</text>
    <line x1="0" y1="55" x2="110" y2="55" stroke="#e2e8f0" stroke-width="1"/>
    <text x="0" y="70" font-family="sans-serif" font-size="8" fill="#64748b">12 modules × 200W</text>
  </g>
</svg>


