<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB"/>
      <stop offset="100%" style="stop-color:#E0F4FF"/>
    </linearGradient>
  </defs>
  <rect fill="url(#sky)" width="400" height="280"/>
  <!-- Sun -->
  <circle cx="320" cy="60" r="40" fill="#FFD700"/>
  <!-- Solar panels -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="120" height="80" fill="#1a365d" stroke="#2c5282" stroke-width="2" transform="skewY(-5)"/>
    <line x1="40" y1="0" x2="40" y2="80" stroke="#2c5282" stroke-width="2" transform="skewY(-5)"/>
    <line x1="80" y1="0" x2="80" y2="80" stroke="#2c5282" stroke-width="2" transform="skewY(-5)"/>
    <line x1="0" y1="26" x2="120" y2="26" stroke="#2c5282" stroke-width="2" transform="skewY(-5)"/>
    <line x1="0" y1="53" x2="120" y2="53" stroke="#2c5282" stroke-width="2" transform="skewY(-5)"/>
  </g>
  <g transform="translate(180, 90)">
    <rect x="0" y="0" width="120" height="80" fill="#1a365d" stroke="#2c5282" stroke-width="2" transform="skewY(-5)"/>
    <line x1="40" y1="0" x2="40" y2="80" stroke="#2c5282" stroke-width="2" transform="skewY(-5)"/>
    <line x1="80" y1="0" x2="80" y2="80" stroke="#2c5282" stroke-width="2" transform="skewY(-5)"/>
    <line x1="0" y1="26" x2="120" y2="26" stroke="#2c5282" stroke-width="2" transform="skewY(-5)"/>
    <line x1="0" y1="53" x2="120" y2="53" stroke="#2c5282" stroke-width="2" transform="skewY(-5)"/>
  </g>
  <!-- Worker silhouette -->
  <g transform="translate(280, 140)">
    <circle cx="20" cy="0" r="15" fill="#f59e0b"/>
    <ellipse cx="20" cy="45" rx="18" ry="30" fill="#f59e0b"/>
  </g>
</svg>


