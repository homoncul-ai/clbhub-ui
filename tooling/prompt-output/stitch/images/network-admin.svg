<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280">
  <defs>
    <linearGradient id="bgNet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#312e81"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect fill="url(#bgNet)" width="400" height="280"/>
  <!-- Server rack -->
  <rect x="60" y="40" width="120" height="200" rx="5" fill="#374151" stroke="#4b5563" stroke-width="2"/>
  <!-- Server units -->
  <g fill="#1f2937" stroke="#4b5563">
    <rect x="70" y="55" width="100" height="25" rx="3"/>
    <rect x="70" y="90" width="100" height="25" rx="3"/>
    <rect x="70" y="125" width="100" height="25" rx="3"/>
    <rect x="70" y="160" width="100" height="25" rx="3"/>
    <rect x="70" y="195" width="100" height="25" rx="3"/>
  </g>
  <!-- LED lights -->
  <g fill="#22c55e">
    <circle cx="85" cy="67" r="3"/>
    <circle cx="95" cy="67" r="3"/>
    <circle cx="85" cy="102" r="3"/>
    <circle cx="95" cy="102" r="3"/>
    <circle cx="85" cy="137" r="3"/>
    <circle cx="95" cy="137" r="3"/>
  </g>
  <g fill="#3b82f6">
    <circle cx="105" cy="67" r="3"/>
    <circle cx="105" cy="102" r="3"/>
    <circle cx="105" cy="137" r="3"/>
  </g>
  <!-- Network lines -->
  <g stroke="#6366f1" stroke-width="2" fill="none">
    <path d="M180 140 Q 250 100 320 140"/>
    <path d="M180 140 Q 250 180 320 140"/>
    <path d="M180 140 L 250 80"/>
    <path d="M180 140 L 250 200"/>
  </g>
  <!-- Network nodes -->
  <circle cx="320" cy="140" r="15" fill="#6366f1"/>
  <circle cx="250" cy="80" r="10" fill="#818cf8"/>
  <circle cx="250" cy="200" r="10" fill="#818cf8"/>
  <!-- Person at computer -->
  <g transform="translate(280, 100)">
    <rect x="0" y="60" width="60" height="40" rx="3" fill="#374151"/>
    <rect x="10" y="65" width="40" height="25" fill="#1e1b4b"/>
    <rect x="20" y="100" width="20" height="5" fill="#4b5563"/>
  </g>
</svg>


