<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Onboard Business User</title>
  <link rel="stylesheet" href="/public/common/clbhub.css" />
</head>
<body>
  <main class="page">
    <section class="card">
      <h1>Business User Onboarding</h1>
      <p>Please complete the fields below to start your onboarding request.</p>

      <form id="onboard-business-user-form" action="#" method="post">
        <div class="form-row">
          <label for="firstName">First Name</label>
          <input id="firstName" name="firstName" type="text" autocomplete="given-name" required />
        </div>

        <div class="form-row">
          <label for="lastName">Last Name</label>
          <input id="lastName" name="lastName" type="text" autocomplete="family-name" required />
        </div>

        <div class="form-row">
          <label for="messageHandle">Message Handle</label>
          <input id="messageHandle" name="messageHandle" type="text" autocomplete="username" required />
        </div>

        <div class="form-row">
          <label for="inviteId">Invite ID</label>
          <input id="inviteId" name="inviteId" type="text" required />
        </div>

        <div class="actions">
          <button class="button" type="submit">Submit</button>
          <a class="button secondary" href="/public/onboard/index.html">Back</a>
        </div>
      </form>
    </section>
  </main>

  <script>
    (function setInviteIdFromQuery() {
      var params = new URLSearchParams(window.location.search);
      var inviteId = params.get('inviteId');
      if (inviteId) {
        var inviteInput = document.getElementById('inviteId');
        if (inviteInput) {
          inviteInput.value = inviteId;
        }
      }
    })();
  </script>
</body>
</html>
