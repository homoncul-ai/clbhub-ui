<div class="buba-container">
  <div class="buba-name-container">Catalog : {{catalog.name}} </div>
  <div class="buba-name">{{catalog.businessCode}}</div>
  <hr/>
  <div class="buba-details">
    <div class="buba-type" *ngIf="catalogTypeCode"> {{catalogTypeCode}}</div>
    <div class="buba-code" *ngIf="entryCode">{{entryCode}}</div>
    <div class="buba-name">{{title}}</div>
  </div>
</div>
