<div class="buba-container">
  <i class="{{icon}}"></i>
  <span class="buba-name">{{title}}</span>
  <span class="buba-id">({{entityId}})</span>
  <div class="buba-details">
    <span class="buba-code" *ngIf="entryCode">{{entryCode}}</span>
    <span class="buba-description" *ngIf="shortDescription">{{shortDescription}}</span>
    <span class="buba-type" *ngIf="catalogTypeCode">Type: {{catalogTypeCode}}</span>
  </div>
</div>
