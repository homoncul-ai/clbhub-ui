<div [class]="getContainerClasses()" [ngStyle]="getContainerStyles()">
  <!-- Optional Title -->
  @if (title) {
    <div class="markdown-title">
      <h4>{{ title }}</h4>
    </div>
  }

  <!-- Display Mode -->
  @if (modeName === 'display') {
    <!-- Common Markdown -->
    @if (dialect === 'common') {
      <div class="markdown-content common-markdown" [innerHTML]="renderedHtml"></div>
    }

    <!-- Markdeep (rendered in iframe) -->
    @if (dialect === 'markdeep') {
      <iframe 
        #markdeepFrame
        class="markdeep-frame"
        sandbox="allow-scripts allow-same-origin"
        title="Markdeep Content">
      </iframe>
    }
  }

  <!-- Edit Mode -->
  @if (modeName === 'edit') {
    <!-- Markdown checkbox -->
    <div class="edit-toolbar">
      <div class="form-check">
        <input
          mdbCheckbox
          class="form-check-input"
          type="checkbox"
          id="markdown-checkbox"
          [(ngModel)]="isMarkdown"
          (change)="onMarkdownChange()"
        />
        <label class="form-check-label" for="markdown-checkbox">
          Markdown
        </label>
      </div>
    </div>

    <!-- Edit/Preview Tabs -->
    <mdb-tabs (activeTabChange)="onEditTabChange($event)">
      <mdb-tab title="Edit">
        <ng-template mdbTabContent>
          <textarea 
            class="markdown-editor"
            [value]="editContent"
            (input)="onEditContentChange($event)"
            placeholder="Enter content...">
          </textarea>
        </ng-template>
      </mdb-tab>
      <mdb-tab title="Preview">
        <ng-template mdbTabContent>
          <div class="markdown-preview-tab">
            @if (isMarkdown && dialect === 'common') {
              <div class="markdown-content common-markdown" [innerHTML]="renderedHtml"></div>
            } @else {
              <div class="plain-text-preview">{{ editContent }}</div>
            }
          </div>
        </ng-template>
      </mdb-tab>
    </mdb-tabs>
  }

  <!-- Empty state -->
  @if (!markdown && modeName === 'display') {
    <div class="markdown-empty">
      <em>No content available</em>
    </div>
  }
</div>
