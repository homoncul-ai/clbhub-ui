<div class="tabset">
  <ul class="tab-nav">
    <li 
      *ngFor="let tab of tabs"
      [class.active]="tab.id === currentTabId"
      (click)="selectTab(tab.id)"
      class="tab-item">
      <ng-container *ngIf="tab.showingTabFunction()">
        {{ tab.label }}
      </ng-container>
    </li>
  </ul>
</div>
