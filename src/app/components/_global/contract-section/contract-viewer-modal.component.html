<div class="contract-modal-backdrop" (click)="closeModal()"></div>
<section class="contract-modal card border-0 shadow" role="dialog" aria-modal="true" aria-label="Contract details">
  <header class="modal-header">
    <h5 class="modal-title mb-0">{{ title || 'Contract' }}</h5>
    <button type="button" class="btn-close" aria-label="Close" (click)="closeModal()"></button>
  </header>

  <div class="modal-body">
    <app-std-markdown-display [markdown]="markdown || ''" [dialect]="'common'" [modeName]="'display'"></app-std-markdown-display>
  </div>
</section>
