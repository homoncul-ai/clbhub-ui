<!-- PMessage entity UI -->
<div *ngIf="entityType === 'catalogentryinterest'">
 <h3>Catalog Entry Interest</h3>
 <app-catalogentryinterest-crud [id]="entityId" [modeName]="'details'"></app-catalogentryinterest-crud>
</div>

<div *ngIf="entityType === 'catalogsearchresult'">
    <h3>Catalog Search Result</h3>
</div>

<div *ngIf="entityType === 'pmfile'">
    <app-std-bubfile [entityId]="entityId" ></app-std-bubfile>
</div>
    <!-- PMFileGroup entity UI -->
<div *ngIf="entityType === 'pmfilegroup'">
    <app-pmfilegroup-ui [id]="entityId" [readonly]="readonly"></app-pmfilegroup-ui>
</div>

<div *ngIf="entityType === 'providerrequest'">
     <app-providerrequest-crud [id]="entityId" [modeName]="modeName"></app-providerrequest-crud>
  </div>
 

<!-- WorkRequest entity UI -->
<div *ngIf="entityType === 'workrequestdeliverable'">
  <h3>Work Request Deliverable</h3>
</div>


<!-- Fallback for unknown entity types -->
<div *ngIf="entityType && !isSupportedEntity()" class="unknown-entity-type">
  <div class="alert alert-warning">
    <i class="fas fa-exclamation-triangle me-2"></i>
    Unknown entity type: <strong>{{ entityType }}</strong>
  </div>
</div>

{{ entityType }} : {{ entityId }} : {{ modeName }}
