<div class="std-mdb-entitystate-container">
  <!-- Loading indicator -->
  <div *ngIf="isLoading" class="loading-container">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <span class="loading-text">Loading state changes...</span>
  </div>

  <!-- Error message  
  <div *ngIf="error && !isLoading" class="alert alert-danger" role="alert">
    <i class="fas fa-exclamation-triangle me-2"></i>
    {{ error }}
    <button type="button" class="btn btn-sm btn-outline-danger ms-2" (click)="refresh()">
      <i class="fas fa-redo"></i> Retry
    </button>
  </div>
-->
  <!-- Menu items display -->
  <div *ngIf="!isLoading" class="d-flex align-items-center">
    <label class="me-3 mb-0">{{ currentStateCode }}</label>
    <app-simple-buttonbar [buttonBar]="getSimpleButtonBar()" displayMode="select" placeholder="Transition to next state ... " (buttonSelected)="onButtonSelected($event)"></app-simple-buttonbar>
    <!-- <app-menu-control-data-list [menuControlDataList]="menuControlDataList" (menuItemSelected)="onMenuItemSelected($event)"></app-menu-control-data-list> -->
  </div>

  <!-- No menu items message -->
  <div *ngIf="!isLoading && !error && !hasMenuItems" class="no-items-container">
    <div class="text-center text-muted">
      <i class="fas fa-info-circle fa-2x mb-3"></i>
      <p>No state changes available for this entity.</p>
      <button type="button" class="btn btn-outline-primary btn-sm" (click)="refresh()">
        <i class="fas fa-redo"></i> Refresh
      </button>
    </div>
  </div>

  <!-- Debug information (only show in development) -->
  <div *ngIf="currentStateChangeResponse && !isLoading && showingDebug" class="debug-info mt-3">
    <details class="debug-details">
      <summary class="debug-summary">
        <i class="fas fa-bug me-1"></i>
        Debug Information
      </summary>
      <pre class="debug-content">{{ currentStateChangeResponse | json }}</pre>
    </details>
  </div>
</div>
