<pre> buttonBar: {{ buttonBar.hidingButtonBar   }}</pre>
<div *ngIf="!buttonBar.hidingButtonBar" class="buttonbar">
  <div class="button-bar" *ngIf="displayMode === 'buttons'">
          <ng-container *ngFor="let button of buttonBar.buttons">
        <button 
          mat-button
          *ngIf="button.showingButtonFunction()"
          (click)="selectButton(button.id)"
          class="button-item">
          {{ button.label }}
        </button>
      </ng-container>
  </div>
  
</div>
