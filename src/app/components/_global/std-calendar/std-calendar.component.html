<div class="std-calendar" #calendarContainer>
  <!-- Calendar Header -->
  <div class="calendar-header">
    <div class="calendar-navigation">
      <button class="nav-btn" (click)="previousMonth()" title="Previous Month">
        <i class="fas fa-chevron-left"></i>
      </button>
      <div class="current-month-year">
        <span class="month-name">{{ currentMonthName }}</span>
        <span class="year">{{ currentYear }}</span>
      </div>
      <button class="nav-btn" (click)="nextMonth()" title="Next Month">
        <i class="fas fa-chevron-right"></i>
      </button>
    </div>
    <button class="today-btn" (click)="goToToday()">
      Today
    </button>
  </div>

  <!-- Week Days Header -->
  <div class="calendar-weekdays">
    <div class="weekday" *ngFor="let day of weekDays">{{ day }}</div>
  </div>

  <!-- Calendar Grid -->
  <div class="calendar-grid">
    <div 
      class="calendar-day"
      *ngFor="let day of calendarDays"
      [class.other-month]="!day.isCurrentMonth"
      [class.today]="day.isToday"
      [class.has-events]="day.events.length > 0"
      (click)="onDateClick(day)">
      
      <span class="day-number">{{ day.date.getDate() }}</span>
      
      <!-- Event indicators -->
      <div class="event-indicators" *ngIf="day.events.length > 0">
        <div 
          class="event-dot"
          *ngFor="let event of day.events.slice(0, 3)"
          [style.background-color]="event.color || '#4f46e5'"
          [title]="event.title"
          (click)="onEventClick(event, day.date, $event)">
        </div>
        <span class="more-events" *ngIf="day.events.length > 3">
          +{{ day.events.length - 3 }}
        </span>
      </div>
    </div>
  </div>

  <!-- Legend (optional, can be enabled via input) -->
  <div class="calendar-legend" *ngIf="events.length > 0">
    <div class="legend-item">
      <div class="legend-dot" style="background-color: #4f46e5;"></div>
      <span>Events</span>
    </div>
  </div>
</div>
