<div class="available-selector">
  <div class="form-check">
    <input
      type="checkbox"
      class="form-check-input"
      [id]="uniqueId"
      [checked]="isChecked"
      [disabled]="disabled || readonly"
      [attr.readonly]="readonly ? true : null"
      (change)="onCheckboxChange($event)">
    <label *ngIf="!readonly"
      class="form-check-label"
      [for]="uniqueId">
      {{ label }}
    </label>
  </div>
</div>
