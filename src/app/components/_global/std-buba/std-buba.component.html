<div class="buba-wrapper" [class]="getBubaClasses()">
  <!-- Loading state -->
  <div *ngIf="loading" class="buba-loading-state">
    <i class="fas fa-spinner fa-spin"></i>
    <span>Loading...</span>
  </div>

  <!-- Error state -->
  <div *ngIf="error && !loading" class="buba-error-state">
    <i class="fas fa-exclamation-triangle"></i>
    <span>{{ error }}</span>
  </div>

  <!-- Buba content -->
  <div *ngIf="bubaResult && !loading && !error" class="buba-content">
    <!-- Icon with popup -->
    <div class="buba-icon-container" 
         (mouseenter)="onIconMouseEnter()" 
         (mouseleave)="onIconMouseLeave()">
      <i *ngIf="showIcon" [class]="bubaResult.icon" class="buba-icon"></i>
      
      <!-- Popup window -->
      <div *ngIf="showPopup" class="buba-popup">
        <div class="buba-popup-content">
          <!-- Render the HTML template -->
          <div class="buba-html-content" [innerHTML]="bubaResult.html"></div>
        </div>
      </div>
    </div>

    <!-- Link -->
    <a 
      *ngIf="showLink && bubaResult.routePath && bubaResult.routePath !== '#'"
      [href]="bubaResult.routePath"
      (click)="onBubaClick($event)"
      class="buba-link"
    >
      {{ bubaResult.name }}
    </a>

    <!-- Non-clickable text -->
    <span 
      *ngIf="!showLink || !bubaResult.routePath || bubaResult.routePath === '#'"
      class="buba-text"
    >
      {{ bubaResult.name }}
    </span>
  </div>
</div>
