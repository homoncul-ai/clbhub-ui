<div *ngIf="!loading">
    <h3 *ngIf="isClientView()">Client View</h3>
    <!-- workRequestName, entityStateTransition.currentState.stateName, entityStateTransition.currentState.dateEntered -->
    <app-workrequest-crud
        [id]="id"
        [modeName]="'section'"
        (crudComponentRequiresRefresh)="componentRequiresRefresh()"
        [readonly]="isClientView()"
    ></app-workrequest-crud>
    <hr />

    <div *ngIf="canUpdateWorkRequest()">
        <app-workrequest-update
            [id]="id"
            [modeName]="'detail'"
            (crudComponentRequiresRefresh)="componentRequiresRefresh()"
        ></app-workrequest-update>
    </div>

    <div *ngIf="isShowingItemsList()">
        <app-workrequestitem-list
            [criteria]="itemsCriteria"
            [showingSearch]="false"
            [showingSearchHeading]="false"
            [showingGoButton]="false"
            [showingAddButton]="false"
            [showingIdCheckbox]="false"
            [onRowClickBehavior]="onClickWorkRequestItemBehavior()"
        ></app-workrequestitem-list>
    </div>

    <!-- Work request related tab -->
    <app-simple-tabset
        *ngIf="showingTabset"
        [tabs]="tabs"
        [currentTabId]="currentTabId"
    ></app-simple-tabset>

    <div *ngIf="currentTabId === 'details'">
        <div *ngIf="isShowingDeliverable()">
            <app-workrequestdeliverable-ui
                [deliverable]="getDeliverable()"
                [readonly]="true"
            ></app-workrequestdeliverable-ui>
        </div>
    </div>

    <div *ngIf="currentTabId === 'details-complete'">
        <div class="column-right">
            <app-std-entity-section
                [entityType]="getWorkRequest().subjectEntityType || ''"
                [entityId]="getWorkRequest().subjectEntityId || ''"
            ></app-std-entity-section>
        </div>
    </div>

    <div *ngIf="currentTabId === 'items'">
        <div id="items" *ngIf="true">
            <app-workrequestitem-list
                [criteria]="itemsCriteria"
                [showingSearch]="false"
                [showingSearchHeading]="false"
                [showingGoButton]="false"
                [showingAddButton]="false"
                [showingIdCheckbox]="false"
                [onRowClickBehavior]="onClickWorkRequestItemBehavior()"
            ></app-workrequestitem-list>
        </div>
    </div>

    <div *ngIf="currentTabId === 'workRequestItem'">
        <app-workrequestitem-crud
            [id]="childId"
            modeName="section"
        ></app-workrequestitem-crud>

        <div
            *ngIf="
                canChangeWorkItemStateToComplete(this.workRequestItem) === true
            "
            class="detail-group"
        >
            <!-- <label>Current State Code:</label>
      <span>{{ this.workRequestItem?.getCurrentStateCode() }} 
      <input type="button" value="Complete Item" (click)="openCompleteWorkRequestItemModal()"></span> -->
        </div>
        <div class="detail-group" *ngIf="this.workRequestItem !== null">
            <label>Current State Code:</label>
            <app-std-mdb-entitystate
                [currentStateCode]="
                    this.workRequestItem.getCurrentStateCode() || ''
                "
                [entityName]="'WorkRequestItem'"
                [entityId]="this.workRequestItem.getId()"
                (stateChangeComplete)="onStateChangeComplete()"
            ></app-std-mdb-entitystate>
        </div>

        <div *ngIf="workRequestItem?.getActionCode() === 'EnqueueRFI'">
            <h6>Show Enqueue RFI Content</h6>
        </div>

        <div *ngIf="workRequestItem?.getActionCode() === 'AttachRFIContent'">
            <div *ngIf="workRequestItem?.getCurrentStateCode() !== 'completed'">
                <app-workrequestitem-attachrficontent-addentries
                    [id]="id || ''"
                    [childId]="childId || ''"
                ></app-workrequestitem-attachrficontent-addentries>
            </div>

            <div
                *ngIf="
                    workRequestItem?.getCurrentStateCode() === 'completed' &&
                    this.workItemDeliverableId !== ''
                "
            >
                <app-workitemdeliverable-crud
                    [id]="this.workItemDeliverableId"
                    modeName="section"
                ></app-workitemdeliverable-crud>
            </div>
        </div>
    </div>

    <div *ngIf="currentTabId === 'logs'">
        <div class="mb-3">
            <app-simple-buttonbar
                [buttonBar]="getWorkRequestActionsButtonBar()"
                displayMode="select"
                placeholder="Select an action..."
                (buttonSelected)="onWorkRequestActionSelected($event)"
            >
            </app-simple-buttonbar>
        </div>
        <hr />
        <app-workrequestlog-list
            [criteria]="getLogsCriteria()"
            [showingSearch]="false"
            [showingSearchHeading]="false"
            [showingGoButton]="false"
            [showingAddButton]="false"
            [showingIdCheckbox]="false"
        ></app-workrequestlog-list>
    </div>

    <div *ngIf="currentTabId === 'debug'">
        <h1>CRUD Modes DEBUG</h1>
        <hr />
        <app-workrequest-crud [id]="id" modeName="debug"></app-workrequest-crud>
    </div>

    <div *ngIf="currentTabId === 'fk_menu'">
        <h1>FK_MENU</h1>
    </div>
</div>

<hr />

<div *ngIf="false">
    <li>Id :{{ id }}</li>
    <li>ChildId :{{ childId }}</li>
    <li>Loading :{{ loading }}</li>
    <li>CurrentTabId :{{ currentTabId }}</li>
    <li>ShowingTabset :{{ showingTabset }}</li>
    <li>Tabs :{{ tabs | json }}</li>
    <pre>{{ workRequestUIController | json }}</pre>
  </div>
