
<app-workrequest-crud [id]="id" [modeName]="CRUD_MODES.SECTION"></app-workrequest-crud> 

<app-simple-messages-section [messagesList]="this.messages"></app-simple-messages-section>

<div class="action-buttons">
    <button *ngIf="!isTicketAccepted()" (click)="this.enterMode('accept')" class="btn btn-primary">Accept Ticket</button>
    <!--<button (click)="switchToViewMode()" class="btn btn-secondary">View Mode</button>  -->
    <button *ngIf="isTicketAccepted()" (click)="this.enterMode('reroute')" class="btn btn-primary">Reroute Ticket</button>
</div>
<div *ngIf="currentMode === 'accept'">
    <textarea [(ngModel)]="acceptText" class="form-control" placeholder="Enter your message here"></textarea>
    <button (click)="acceptTicket()" class="btn btn-primary">Accept Ticket</button>
</div>

<div *ngIf="currentMode === 'reroute'">
    <!-- <app-available-selector [available]="availableQueues" (selected)="rerouteTicket($event)"></app-available-selector> -->
    <button (click)="rerouteTicket()" class="btn btn-primary">Reroute Ticket</button>
</div>
<hr/>

<h3>Add Work Request Item </h3>
<!-- create a radio button to select the type of work request item to add -->
<div>
  <input type="radio" name="workRequestItemType" value="attachRFIContent" [checked]="showingAttachRFIContent" (click)="showingAttachRFIContent = true"> Attach RFI Content
  <input type="radio" name="workRequestItemType" value="enqueueRFI" [checked]="!showingAttachRFIContent" (click)="showingAttachRFIContent = false"> Enqueue RFI
</div>
<div *ngIf="isShowingEnqueueRFI() ">
  <!--  <app-workrequest-update [workRequestId]="id" modeName="detail"></app-workrequest-update> -->
  <div id="enqueueRFI"> <h3>Create Items - Enqueue RFI</h3>
    <app-workrequestitem-enqueuerfi [id]="id"></app-workrequestitem-enqueuerfi>
  </div>
</div>

<div *ngIf="isShowingAttachRFIContent() ">
  <div id="attachRFIContent"> <h3>Create Items - Attach RFI Content</h3>
    <app-workrequestitem-attachrficontent [id]="id"></app-workrequestitem-attachrficontent>
  </div>
</div>


  showingEnqueueRFI:  {{ isShowingEnqueueRFI() }}
  showingAttachRFIContent:  {{ isShowingAttachRFIContent() }}
<pre *ngIf="false">
    {{ entity.dump() }}</pre>
