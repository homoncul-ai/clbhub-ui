<!-- 
This displays the signup information for a work request item.
Shows the student name, course, and notes from the student.
-->

<div *ngIf="isLoading() === false" class="signup-container">
  
  <div class="signup-section">
    <h4 class="section-title">Signup Information</h4>
    
    <div class="info-row">
      <label class="info-label"> Name:</label>
      <span class="info-value">{{ getStudentName() }}</span>
    </div>
    
    <div class="info-row">
      <label class="info-label">Course:</label>
      <span class="info-value">{{ getCourseName() }}</span>
    </div>
    
    <div class="info-row notes-section">
      <label class="info-label">Notes from Student:</label>
      <div class="notes-content">{{ getStudentNotes() }}</div>
    </div>
  </div>

</div>
