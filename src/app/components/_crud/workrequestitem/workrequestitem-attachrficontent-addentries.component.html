<!-- <pre> Loaded ATTACHRFI </pre> -->
<div *ngIf="isLoading() === false">

    <div *ngIf="isWorkRequestItemInProcess() === true" class="detail-group">
        <label>Current State Code:</label>
        <span>{{ this.workRequestItem?.getCurrentStateCode() }} <input type="button" value="Complete Item" (click)="changeWorRequestItemStateToComplete()"></span>
    </div>

    <app-catalogsearchresult-crud [id]="this.catalogSearchResult?.id" modeName="section"></app-catalogsearchresult-crud>
    <hr>

    <div *ngIf="isWorkRequestItemComplete() == true">
        <app-catalogsearchresultentry-list [criteria]="this.getCriteriaForEntries()" [showingSearch]="false" 
        [showingSearchHeading]="true" 
        [searchHeadingLabel]="'Selected Entries for ' + getCatalogCode()"
        [showingGoButton]="false" [showingAddButton]="false" [showingIdCheckbox]="false" [onRowClickBehavior]="clickRowToShowEntry()"
        [otherData]="getCatalogEntryOtherData()"></app-catalogsearchresultentry-list> 
    </div>

    <div *ngIf="isWorkRequestItemComplete() !== true">
    <app-simple-messages-section [messagesList]="this.messages"></app-simple-messages-section>
    
    <app-catalogsearchresultentry-list [criteria]="this.getCriteriaForEntries()" 
    [showingSearch]="false" 
    [showingSearchHeading]="!this.isStateCompleted()" 
    [searchHeadingLabel]="'Add selected Entries from catalog  ' + getCatalogCode()"
    [showingGoButton]="false" [showingAddButton]="false" [showingIdCheckbox]="!this.isStateCompleted()" [onRowClickBehavior]="clickRowToShowEntry()"
    [onGoClickAction]="getOnGoRemoveCatalogEntriesToRFI()" goButtonLabel="Remove Selected Items" 
    [buttonBar]="getSelectedActionsButtonBar()"
    [otherData]="getCatalogEntryOtherData()"></app-catalogsearchresultentry-list> 
    
</div>

</div>
