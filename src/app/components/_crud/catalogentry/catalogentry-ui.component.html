<app-simple-tabset *ngIf="showingTabset" [tabs]="tabs" [currentTabId]="currentTabId" ></app-simple-tabset>

<div *ngIf="!loading">

  <span class="h3"> 
    <app-std-buba [entityName]="getCurrentEntity().getData().entityType || ''" [entityId]="getCurrentEntity().getId() || ''"></app-std-buba>    
  </span>

</div>

<div *ngIf="currentTabId === 'details' && this.isReadOnly() == false" >
  <app-catalogentry-crud [id]="id" modeName="edit" ></app-catalogentry-crud>
</div>
<div *ngIf="currentTabId === 'details' && this.isReadOnly() == true">
  <app-catalogentry-crud [id]="id" modeName="card"></app-catalogentry-crud>
</div>
 
<div *ngIf="currentTabId === 'vocode'">
  <app-vocationencoding-display [id]="getCurrentEntity().getData().vocodeInstanceId || ''" readonly="this.isReadOnly()"></app-vocationencoding-display>
</div>

<div *ngIf="currentTabId === 'signupPacket'">
  <app-catalogentrysignuppacket-ui [id]="getCurrentEntity().getData().signupPacketId || ''" readonly="this.isReadOnly()"></app-catalogentrysignuppacket-ui>
</div>

<div *ngIf="currentTabId === 'signup'">
  <h1>Signup</h1>
  
  <!-- Signup Packet Selection Card -->
  <div class="card mb-4">
    <div class="card-header">
      <h5 class="mb-0"><i class="fas fa-file-signature me-2"></i>Select Signup Packet</h5>
    </div>
    <div class="card-body">
      <div class="row align-items-end">
        <div class="col-md-6">
          <label class="form-label">Signup Packet</label>
          <app-menu-control-data-list 
            [menuControlDataList]="getSignupPacketMenu()"
            [(ngModel)]="signupPacketId"
            (selectionChange)="onSignupPacketChange($event)"
            placeholder="Select a signup packet...">
          </app-menu-control-data-list>
        </div>
        <div class="col-md-6">
          <button 
            class="btn btn-primary" 
            (click)="saveSignupPacketSelection()" 
            [disabled]="savingSignupPacket">
            <i *ngIf="savingSignupPacket" class="fas fa-spinner fa-spin me-2"></i>
            <i *ngIf="!savingSignupPacket" class="fas fa-save me-2"></i>
            {{ savingSignupPacket ? 'Saving...' : 'Save Selection' }}
          </button>
          
          <!-- Success indicator -->
          <span *ngIf="saveSuccess" class="text-success ms-3">
            <i class="fas fa-check-circle me-1"></i>Saved successfully!
          </span>
          
          <!-- Error indicator -->
          <span *ngIf="saveError" class="text-danger ms-3">
            <i class="fas fa-exclamation-circle me-1"></i>{{ saveError }}
          </span>
        </div>
      </div>
    </div>
  </div>

  <!-- Display the selected signup packet details -->
  <div *ngIf="getSignupPacketId()">
    <app-catalogentrysignuppacket-ui [id]="getSignupPacketId()" ></app-catalogentrysignuppacket-ui>
  </div>
  
  <div *ngIf="!getSignupPacketId()" class="alert alert-info">
    <i class="fas fa-info-circle me-2"></i>No signup packet selected. Select a signup packet from the dropdown above to view its details.
  </div>
</div>

<pre>
currentTabId: {{currentTabId}}
id: {{id}}
readonly: {{isReadOnly()}}
</pre>
