<app-simple-tabset *ngIf="showingTabset" [tabs]="tabs" [currentTabId]="currentTabId"></app-simple-tabset>

<div *ngIf="currentTabId === 'list'">
  <app-paipromptref-list></app-paipromptref-list>
</div>

<div *ngIf="currentTabId === 'details'">
  <app-paiprompt-crud [id]="id" modeName="detail"></app-paiprompt-crud>
</div>

<div *ngIf="currentTabId === 'create'">
  <h1>Create</h1>
  <app-paiprompt-crud [id]="id" modeName="create"></app-paiprompt-crud>
</div>
