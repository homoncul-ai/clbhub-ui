<app-simple-tabset *ngIf="showingTabset" [tabs]="tabs" [currentTabId]="currentTabId"></app-simple-tabset>

<div *ngIf="currentTabId === 'list'">
  <app-puserinvite-list></app-puserinvite-list>
</div>

<div *ngIf="currentTabId === 'details'">
  <app-puserinvite-crud [id]="id" modeName="detail"></app-puserinvite-crud>
</div>

<div *ngIf="currentTabId === 'create'">
  <h1>Create</h1>
  <app-puserinvite-crud [id]="id" modeName="create"></app-puserinvite-crud>
</div>
