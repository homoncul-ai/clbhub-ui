
<div *ngIf="!loading">
  <app-simple-tabset *ngIf="showingTabset" [tabs]="tabs" [currentTabId]="currentTabId" ></app-simple-tabset>

   
<div *ngIf="currentTabId === 'home'">
  
  <h4>Students Z</h4>
  <app-citizen-list [criteria]="getMyStudentsCriteria()" [showingSearchHeading]="false" 
  [showingSearch]="true" [showingGoButton]="false" [showingAddButton]="false" [showingIdCheckbox]="false"
  [onRowClickBehavior]="onClickRowStudent()"></app-citizen-list>

</div>
 
<div *ngIf="currentTabId === 'student'">
  <!-- <app-hccluserprofile-crud [id]="childId" modeName="detail"></app-hccluserprofile-crud> -->
  <ng-container *ngIf="childId as selectedUserProfileId">
    <app-citizen-ui [userProfileId]="selectedUserProfileId"></app-citizen-ui>
  </ng-container>

</div> 


<div *ngIf="currentTabId === 'tickets'">

  <app-workrequest-list [criteria]="getMyStudentTicketsCriteria()" [showingSearchHeading]="false" 
  [showingSearch]="true" [showingGoButton]="false" [showingAddButton]="false" [showingIdCheckbox]="false"
  [onRowClickBehavior]="onClickWorkRequestRow()"></app-workrequest-list>

</div> 



<div *ngIf="currentTabId === 'ticket-history'">
  <h2>Ticket history</h2>

</div> 

<div *ngIf="false">
<li>CurrentId :{{currentTabId}}</li>
<li>CurrentUserProfileId :{{currentUserProfileId}}</li>
<li>Id :{{id}}</li>
<li>ChildId :{{childId}}</li>
<li>Loading :{{loading}}</li>
<li>ShowingTabset :{{showingTabset}}</li>
<li>Tabs :{{tabs}}</li> 
</div>
</div>
