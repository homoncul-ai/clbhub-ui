

<div *ngIf="!loading">
  <app-simple-tabset *ngIf="showingTabset" [tabs]="tabs" [currentTabId]="currentTabId" ></app-simple-tabset>

   
<div *ngIf="currentTabId === 'home'">
  
  <h3>Tickets from </h3>

  
  <ng-container *ngFor="let block of workRequestListBlocks">
    <h4>{{block.title}}</h4>
    <app-workrequest-list [criteria]="block.criteria" [showingSearchHeading]="false" 
    [showingSearch]="false" [showingGoButton]="false" [showingAddButton]="false" [showingIdCheckbox]="false"
    [onRowClickBehavior]="onClickWorkRequestRow()"></app-workrequest-list>
  </ng-container>
</div>
 
<div *ngIf="currentTabId === 'messages'">
  <h2>Messages</h2>

  <app-advo-messages [id]="id" modeName="detail"></app-advo-messages>

</div> 


<div *ngIf="currentTabId === 'ticket-history'">
  <h2>Ticket history</h2>

</div> 

<div *ngIf="true">
<li>CurrentId :{{currentTabId}}</li>
<li>Id :{{id}}</li>
<li>ChildId :{{childId}}</li>
<li>Loading :{{loading}}</li>
<li>ShowingTabset :{{showingTabset}}</li>
<li>Tabs :{{tabs}}</li> 
</div>
</div>
