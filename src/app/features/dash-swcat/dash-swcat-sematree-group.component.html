<app-simple-tabset *ngIf="showingTabset" [tabs]="tabs" [currentTabId]="currentTabId" ></app-simple-tabset>

<div *ngIf="currentTabId === 'overview'">
  <h1>SemaTree - Overview</h1>
  <app-swcat-sematree-tab-overview [id]="this.id"></app-swcat-sematree-tab-overview>
</div>

<div *ngIf="currentTabId === 'usage'">
  <h1>SemaTree - Software Usage</h1>
  <app-swcat-sematree-tab-usage [id]="this.id"></app-swcat-sematree-tab-usage>
</div>

<div *ngIf="true">
    <li>CurrentId :{{currentTabId}}</li>
    <li>Id :{{id}}</li>
    <li>ChildId :{{childId}}</li>
    <li>Loading :{{loading}}</li>
    <li>ShowingTabset :{{showingTabset}}</li>
    <li>Tabs :{{tabs}}</li> 
  </div>
