<div class="container-fluid">
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-body">

          <div class="filter-row">
            <div class="available-only-checkbox">
              <input
                type="checkbox"
                id="hide-irrelevant-orgs"
                [(ngModel)]="hideIrrelevant"
                (change)="performSearch()">
              <label for="hide-irrelevant-orgs">Hide irrelevant</label>
            </div>
          </div>

          <div class="search-bar-container">
            <div class="search-input-wrapper">
              <input
                type="text"
                class="search-input"
                placeholder="Search organizations..."
                [(ngModel)]="searchKeyword"
                (keyup.enter)="performSearch()">
            </div>
            <button class="search-button" (click)="performSearch()">
              <i class="fas fa-search me-1"></i>
              Search
            </button>
          </div>

          <div class="loading-container" *ngIf="isLoading">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
            <p>Searching...</p>
          </div>

          <div *ngIf="error" class="alert alert-danger" role="alert">
            {{ error }}
          </div>

          <div class="no-results" *ngIf="!isLoading && hasSearched && rawSearchResults.length === 0">
            <i class="fas fa-search fa-3x mb-3 text-muted"></i>
            <p>No organizations found. Try adjusting your search criteria.</p>
          </div>

          <div class="results-container" *ngIf="!isLoading && rawSearchResults.length > 0">
            <div class="results-grid">
              <div class="result-card" *ngFor="let result of rawSearchResults">
                <div class="detail-group">
                  <label>{{ result.name }}</label>
                  <div class="interest-icons">
                    <ng-container *ngIf="!result.organizationInterest">
                      <button class="interest-icon-btn thumbs-down"
                              (click)="markNotInterested(result)"
                              title="Not Interested">
                        <i class="fas fa-thumbs-down"></i>
                      </button>
                      <button class="interest-icon-btn thumbs-up"
                              (click)="markInterested(result)"
                              title="Interested">
                        <i class="fas fa-thumbs-up"></i>
                      </button>
                    </ng-container>

                    <ng-container *ngIf="result.organizationInterest">
                      <button class="interest-icon-btn thumbs-up active"
                              *ngIf="result.organizationInterest.interest && result.organizationInterest.interest > 0"
                              (click)="toggleInterest(result)"
                              title="You're Interested - Click to remove">
                        <i class="fas fa-thumbs-up"></i>
                      </button>
                      <button class="interest-icon-btn thumbs-down active"
                              *ngIf="result.organizationInterest.interest === 0"
                              (click)="toggleInterest(result)"
                              title="Not Interested - Click to remove">
                        <i class="fas fa-thumbs-down"></i>
                      </button>
                    </ng-container>
                  </div>
                </div>

                <div class="detail-group" *ngIf="result.description">
                  <span>{{ result.description }}</span>
                </div>

                <div class="detail-group" *ngIf="result.mdMissionStatement">
                  <app-std-markdown-display
                    [markdown]="result.mdMissionStatement"
                    modeName="display">
                  </app-std-markdown-display>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
