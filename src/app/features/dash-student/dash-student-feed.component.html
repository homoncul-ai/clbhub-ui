<div class="feed-page">
  <!-- Header Section -->
  <div class="feed-header">
    <div class="header-content">
      <div class="header-icon">
        <i class="fas fa-stream"></i>
      </div>
      <div class="header-text">
        <h1 class="page-title">My Feed</h1>
        <p class="page-subtitle">Stay updated with the latest posts and announcements</p>
      </div>
    </div>
    <button class="refresh-btn" (click)="refreshFeed()" [disabled]="loading">
      <i class="fas fa-sync-alt" [class.fa-spin]="loading"></i>
      Refresh
    </button>
  </div>

  <!-- Loading State -->
  <div class="loading-container" *ngIf="loading">
    <div class="loading-spinner">
      <div class="spinner"></div>
    </div>
    <p class="loading-text">Loading your feed...</p>
  </div>

  <!-- Error State -->
  <div class="error-container" *ngIf="error && !loading">
    <i class="fas fa-exclamation-triangle"></i>
    <p>{{ error }}</p>
    <button class="retry-btn" (click)="refreshFeed()">
      <i class="fas fa-redo"></i>
      Try Again
    </button>
  </div>

  <!-- Empty State -->
  <div class="empty-container" *ngIf="!loading && !error && feedEntries.length === 0">
    <div class="empty-icon">
      <i class="fas fa-inbox"></i>
    </div>
    <h3>No items in your feed yet</h3>
    <p>Check back soon for new posts and updates.</p>
  </div>

  <!-- Feed Container -->
  <div class="feed-container" *ngIf="!loading && feedEntries.length > 0">
    <div 
      class="feed-item"
      *ngFor="let entry of feedEntries; let i = index">
      
      <ng-container *ngIf="entry.feedEntry as feedEntry">
        <!-- Line 1: PostedByEntityName (heading 2) -->
        <h2 class="posted-by-name" *ngIf="feedEntry.postedByEntityName">
          {{ feedEntry.postedByEntityName }}
        </h2>

        <!-- Line 2: PostedByEntityExtra (heading 3) - if exists -->
        <h3 class="posted-by-extra" *ngIf="feedEntry.postedByEntityExtra">
          {{ feedEntry.postedByEntityExtra }}
        </h3>

        <!-- Line 3: Title -->
        <div class="feed-title" *ngIf="feedEntry.title">
          {{ feedEntry.title }}
        </div>

        <!-- Line 4: Image URL - if exists -->
        <div class="feed-image" *ngIf="feedEntry.imageFileUrl">
          <img [src]="feedEntry.imageFileUrl" [alt]="feedEntry.title || 'Feed image'">
        </div>
      </ng-container>

      <!-- Lines Next: MdContents using std-markdown-display readonly -->
      <div class="feed-content" *ngIf="entry.displayMarkdown">
        <app-std-markdown-display 
          [markdown]="entry.displayMarkdown"
          modeName="display"
          dialect="common">
        </app-std-markdown-display>
      </div>

      <!-- More link - if MdMore exists and not expanded -->
      <div class="feed-more" *ngIf="hasMore(entry)">
        <button 
          class="more-btn" 
          (click)="toggleMore(entry)">
          {{ entry.isExpanded ? '(less ...)' : '(more ...)' }}
        </button>
      </div>

    </div>
  </div>
</div>
