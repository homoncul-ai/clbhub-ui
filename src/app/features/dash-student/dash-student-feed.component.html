  <!-- Loading State -->
  <div class="loading-container" *ngIf="loading">
    <div class="loading-spinner">
      <div class="spinner"></div>
    </div>
    <p class="loading-text">Loading your feed...</p>
  </div>

  <!-- Error State -->
  <div class="error-container" *ngIf="error && !loading">
    <i class="fas fa-exclamation-triangle"></i>
    <p>{{ error }}</p>
    <button class="retry-btn" (click)="refreshFeed()">
      <i class="fas fa-redo"></i>
      Try Again
    </button>
  </div>

  <!-- Empty State -->
  <div class="empty-container" *ngIf="!loading && !error && feedEntries.length === 0">
    <div class="empty-icon">
      <i class="fas fa-inbox"></i>
    </div>
    <h3>No items in your feed yet</h3>
    <p>Check back soon for new posts and updates.</p>
  </div>

  <!-- Feed Container -->
  <div class="feed-container" *ngIf="!loading && feedEntries.length > 0">
    <div class="feed-item" *ngFor="let entry of feedEntries; let i = index">
      <ng-container *ngIf="entry.feedEntry as feedEntry">
    
        <!-- Card Header: logo + org + X -->
        <div class="feed-card-header">
          <div class="org">
            <div class="org-logo">
              <!-- If you have a logo URL field, bind it here -->
              <img
                *ngIf="feedEntry.imageFileUrl; else initials"
                [src]="feedEntry.imageFileUrl"
                alt="Org logo"
              />
              <ng-template #initials>
                <span class="org-initials">
                  {{ (feedEntry.postedByEntityName || '?') | slice:0:1 }}
                </span>
              </ng-template>
            </div>
    
            <div class="org-meta">
              <div class="org-name">
                {{ feedEntry.postedByEntityName }}
              </div>
              <div class="org-extra" *ngIf="feedEntry.postedByEntityExtra">
                {{ feedEntry.postedByEntityExtra }}
              </div>
            </div>
          </div>
    
          <button class="dismiss-btn" type="button" (click)="dismiss(entry)">
            <i class="fas fa-times"></i>
          </button>
        </div>
    
        <!-- Heading (catalog name) -->
        <div class="feed-heading" *ngIf="feedEntry.postedByEntityExtra">
          {{ feedEntry.postedByEntityExtra }}
        </div>
    
        <!-- Title (course name) -->
        <div class="feed-title" *ngIf="feedEntry.title">
          {{ feedEntry.title }}
        </div>
    
        <!-- Markdown -->
        <div class="feed-content" *ngIf="entry.displayMarkdown">
          <app-std-markdown-display
            [markdown]="entry.displayMarkdown"
            modeName="display"
            dialect="common">
          </app-std-markdown-display>
        </div>
    
        <!-- More/Less -->
        <div class="feed-more" *ngIf="hasMore(entry)">
          <button class="more-btn" type="button" (click)="toggleMore(entry)">
            {{ entry.isExpanded ? '(less ...)' : '(more ...)' }}
          </button>
        </div>
    
        <!-- Action bar -->
        <div class="feed-actions">
          <button class="action-btn" type="button" (click)="thumbUp(entry)">
            <i class="far fa-thumbs-up"></i>
          </button>
          <button class="action-btn" type="button" (click)="thumbDown(entry)">
            <i class="far fa-thumbs-down"></i>
          </button>
    
          <div class="spacer"></div>
    
          <button class="action-btn" type="button" (click)="moreActions(entry)">
            <i class="fas fa-ellipsis-h"></i>
          </button>
        </div>
    
      </ng-container>
    </div>
    
  </div>
</div>
