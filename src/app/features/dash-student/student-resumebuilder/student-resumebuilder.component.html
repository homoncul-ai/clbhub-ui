<div class="container-fluid">
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-body">
          <p class="text-muted mb-4">
            Build and manage your professional resumes. View all your resumes across personal goals.
          </p>

          <!-- Resume List showing all resumes for the user -->
          <app-student-personalstatement-resume-list 
            [showAllResumes]="true"
            [onRowClickBehavior]="getResumeRowClickBehavior()"
            [showingSearch]="true" 
            [showingSearchHeading]="true" 
            [showingGoButton]="false" 
            [showingAddButton]="false" 
            [showingIdCheckbox]="false">
          </app-student-personalstatement-resume-list>
        </div>
      </div>
    </div>
  </div>
</div>
