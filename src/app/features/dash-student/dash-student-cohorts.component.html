<div class="dash-student-cohorts container-fluid">
  <p class="text-muted mb-3">
    Static participant UI specs — open a cohort mock to explore the MVP wireframe with documentation links.
  </p>

  <div class="row g-3">
    <div *ngFor="let spec of cohortSpecs" class="col-md-6">
      <div class="ui-card h-100 cohort-spec-card">
        <div class="ui-card-body">
          <h5 class="mb-2">{{ spec.label }}</h5>
          <p class="text-muted small mb-2">{{ spec.description }}</p>
          <dl class="cohort-spec-dl mb-3">
            <dt>Leader</dt>
            <dd>{{ spec.leader }}</dd>
            <dt>Schedule</dt>
            <dd>{{ spec.schedule }}</dd>
          </dl>
          <a [routerLink]="spec.route" class="btn btn-outline-success btn-sm">
            <i class="fas fa-drafting-compass me-2"></i>
            Open participant UI spec
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
