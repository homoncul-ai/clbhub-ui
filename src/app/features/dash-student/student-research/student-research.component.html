<div class="container-fluid">
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-header">
          <h3 class="card-title">
            <i class="fas fa-code me-2"></i>
            Reasearch Careers
          </h3>
        </div>
        <div class="card-body">

    <!-- Search Bar -->
    <div class="search-bar-container">
      <div class="search-input-wrapper">
        <span class="search-icon material-icons">search</span>
        <input 
          type="text" 
          class="search-input" 
          placeholder="Search vocation encoding references..."
          [(ngModel)]="searchKeyword"
          (keyup.enter)="performSearch()">
      </div>
      <button class="search-button" (click)="performSearch()">
        <span class="material-icons">search</span>
        Search
      </button>
    </div>

    <!-- Filter Row -->
    <div class="filter-row">
      <div class="available-only-checkbox">
        <input 
          type="checkbox" 
          id="available-only" 
          [(ngModel)]="showAvailableOnly">
        <label for="available-only">Show available only</label>
      </div>
    </div>

    <!-- Loading State -->
    <div class="loading-container" *ngIf="isLoading">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p>Searching...</p>
    </div>

    <!-- No Results (only show after a search has been performed) -->
    <div class="no-results" *ngIf="!isLoading && hasSearched && searchResults.length === 0">
      <i class="fas fa-search fa-3x mb-3 text-muted"></i>
      <p>No results found. Try adjusting your search criteria.</p>
    </div>

    <!-- Results -->
    <div class="results-container" *ngIf="!isLoading && searchResults.length > 0">
      <h2>Results ({{ searchResults.length }})</h2>
      <div class="results-grid">
        <div class="result-card" *ngFor="let result of searchResults; let i = index">
          <!-- VocationEncodingRef CRUD Component in section mode -->
          <app-vocationencodingref-crud 
            [id]="result.id" 
            [modeName]="'section'">
          </app-vocationencodingref-crud>
        </div>
      </div>
    </div>

        </div>
      </div>
    </div>
  </div>
</div>
