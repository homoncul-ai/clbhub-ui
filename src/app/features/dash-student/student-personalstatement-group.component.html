<app-simple-tabset *ngIf="showingTabset" [tabs]="tabs" [currentTabId]="currentTabId" ></app-simple-tabset>

<div *ngIf="currentTabId === 'details'">
  <app-personalstatement-crud [id]="id" modeName="detail"></app-personalstatement-crud>
</div>

<div *ngIf="currentTabId === 'create'">
  <h1>Create</h1>
  <app-personalstatement-crud [id]="id" modeName="create"></app-personalstatement-crud>
</div>

<div *ngIf="currentTabId === 'search'">
  <app-student-personalstatement-search [id]="id" [searchType]="getSearchTypeFromRoute()"></app-student-personalstatement-search>
</div>

<div *ngIf="currentTabId === 'research'">
  <app-student-personalstatement-research [id]="id"></app-student-personalstatement-research>
</div>

<div *ngIf="currentTabId === 'resumes'">
  <div class="mb-3">
    <button class="btn btn-primary" (click)="openCreateResumeModal()">Create New Resume</button>
  </div>
  <app-student-personalstatement-resume-list 
    [criteria]="getResumeCriteria()" 
    [onRowClickBehavior]="getResumeRowClickBehavior()"
    [showingSearch]="false" 
    [showingSearchHeading]="false" 
    [showingGoButton]="false" 
    [showingAddButton]="false" 
    [showingIdCheckbox]="false">
  </app-student-personalstatement-resume-list>
</div>

<div *ngIf="currentTabId === 'resume'">
  <div *ngIf="resume">
    <h3>{{ resume.title }}</h3>
    <!-- Resume detail view will be built here -->
  </div>
</div>
