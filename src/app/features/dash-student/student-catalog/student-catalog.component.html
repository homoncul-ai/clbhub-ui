<div class="container-fluid">
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-header">
          <h3 class="card-title">
            <i class="fas fa-comments me-2"></i>
            Vocational Opportunity Catalog
          </h3>
        </div>
        <div class="card-body">

    <!-- Personal Statement Selection -->
    <div class="personal-statement-section">
      <label class="section-label">
        <i class="fas fa-user-graduate me-2"></i>
        Select Personal Statement:
      </label>
      
      <!-- Loading State -->
      <div *ngIf="isLoadingPersonalStatements" class="ps-loading">
        <span class="spinner-border spinner-border-sm me-2" role="status"></span>
        Loading personal statements...
      </div>
      
      <!-- No Personal Statements -->
      <div *ngIf="!isLoadingPersonalStatements && personalStatements.length === 0" class="ps-empty">
        <i class="fas fa-exclamation-circle me-2"></i>
        No personal statements found. Please create one first.
      </div>
      
      <!-- Personal Statement Buttons -->
      <div class="ps-button-bar" *ngIf="!isLoadingPersonalStatements && personalStatements.length > 0">
        <button 
          *ngFor="let ps of personalStatements"
          class="ps-btn"
          [class.active]="selectedPersonalStatement?.id === ps.id"
          (click)="selectPersonalStatement(ps)"
          [title]="ps.description || ps.name || 'Personal Statement'">
          <i class="fas fa-file-alt me-2"></i>
          {{ ps.name || 'Unnamed Statement' }}
        </button>
      </div>
    </div>
         
    <!-- Search Bar -->
    <div class="search-bar-container" [class.disabled]="!canSearch()">
      <div class="search-input-wrapper">
        <span class="search-icon material-icons">search</span>
        <input 
          type="text" 
          class="search-input" 
          placeholder="Search for jobs, courses, events..."
          [(ngModel)]="searchKeyword"
          (keyup.enter)="performSearch()">
      </div>
      <button class="search-button" (click)="performSearch()" [disabled]="!canSearch()">
        <span class="material-icons">search</span>
        Search
      </button>
    </div>

    <!-- Filter Buttons Row -->
    <div class="filter-row">
      <div class="filter-buttons">
        <button 
          class="filter-btn" 
          [class.active]="selectedCategory === 'all'"
          (click)="selectCategory('all')">
          All
        </button>
        <button 
          class="filter-btn" 
          [class.active]="selectedCategory === 'job'"
          (click)="selectCategory('job')">
          <span class="material-icons">work</span>
          Jobs
        </button>
        <button 
          class="filter-btn" 
          [class.active]="selectedCategory === 'course'"
          (click)="selectCategory('course')">
          <span class="material-icons">school</span>
          Courses
        </button>
        <button 
          class="filter-btn" 
          [class.active]="selectedCategory === 'event'"
          (click)="selectCategory('event')">
          <span class="material-icons">event</span>
          Events
        </button>
      </div>
      <div class="available-only-checkbox">
        <input 
          type="checkbox" 
          id="available-only" 
          [(ngModel)]="showAvailableOnly">
        <label for="available-only">Show available only</label>
      </div>
    </div>

    <!-- Loading State -->
    <div class="loading-container" *ngIf="isLoading">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p>Searching...</p>
    </div>

    <!-- No Results -->
    <div class="no-results" *ngIf="!isLoading && searchResults.length === 0 && searchKeyword">
      <i class="fas fa-search fa-3x mb-3 text-muted"></i>
      <p>No results found. Try adjusting your search criteria.</p>
    </div>

    <!-- Results -->
    <div class="results-container" *ngIf="!isLoading && searchResults.length > 0">
      <h2>Results</h2>
      <div class="results-grid">
        <div class="result-card" *ngFor="let result of searchResults; let i = index" >
        
      <!-- Image on the left -->
        <!-- Catalog Entry CRUD Component -->
      <app-catalogentry-crud 
      [id]="result.id" 
      [modeName]="'section'">
    </app-catalogentry-crud>
    
          <div class="card-footer">
            <button type="button" 
                    class="btn btn-outline-danger btn-sm" 
                    (click)="markNotInterested(result)">
              <i class="fas fa-thumbs-down me-1"></i>Not Interested
            </button>
            <button type="button" 
                    class="btn btn-success btn-sm" 
                    (click)="markInterested(result)">
              <i class="fas fa-thumbs-up me-1"></i>Interested
            </button>
          </div>
        </div>
      </div>
        </div>
      </div>
    </div>
  </div>
</div>
