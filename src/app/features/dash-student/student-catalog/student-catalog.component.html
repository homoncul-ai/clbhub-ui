<div class="container-fluid">
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-header">
          <h3 class="card-title">
            <i class="fas fa-comments me-2"></i>
            Vocational Opportunity Catalog
          </h3>
        </div>
        <div class="card-body">

    <!-- Personal Statement Selection -->
    <app-personal-statement-selector
      label="Select Personal Statement:"
      [autoSelectFirst]="true"
      (selectionChange)="onPersonalStatementChange($event)">
    </app-personal-statement-selector>
         
    <!-- Search Bar -->
    <div class="search-bar-container" [class.disabled]="!canSearch()">
      <div class="search-input-wrapper">
        <input 
          type="text" 
          class="search-input" 
          placeholder="Search for jobs, courses, events..."
          [(ngModel)]="searchKeyword"
          (keyup.enter)="performSearch()">
      </div>
      <button class="search-button" (click)="performSearch()" [disabled]="!canSearch()">
        <i class="fas fa-search me-1"></i>
        Search
      </button>
    </div>

    <!-- Filter Buttons Row -->
    <div class="filter-row">
      <div class="filter-buttons">
        <button 
          class="filter-btn" 
          [class.active]="selectedCategory === 'all'"
          (click)="selectCategory('all')">
           All
        </button>
        <button 
          class="filter-btn" 
          [class.active]="selectedCategory === 'job'"
          (click)="selectCategory('job')">
          <i class="fas fa-briefcase me-1"></i>
          Jobs
        </button>
        <button 
          class="filter-btn" 
          [class.active]="selectedCategory === 'course'"
          (click)="selectCategory('course')">
          <i class="fas fa-graduation-cap me-1"></i>
          Courses
        </button>
        <button 
          class="filter-btn" 
          [class.active]="selectedCategory === 'event'"
          (click)="selectCategory('event')">
          <i class="fas fa-calendar-alt me-1"></i>
          Events
        </button>
      </div>
      <div class="available-only-checkbox">
        <input 
          type="checkbox" 
          id="hide-irrelevant" 
          [(ngModel)]="hideIrrelevant"
          (change)="performSearch()">
        <label for="hide-irrelevant">Hide irrelevant</label>
      </div>
    </div>

    <!-- Loading State -->
    <div class="loading-container" *ngIf="isLoading">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p>Searching...</p>
    </div>

    <!-- No Results -->
    <div class="no-results" *ngIf="!isLoading && searchResults.length === 0 && searchKeyword">
      <i class="fas fa-search fa-3x mb-3 text-muted"></i>
      <p>No results found. Try adjusting your search criteria.</p>
    </div>

    <!-- Results -->
    <div class="results-container" *ngIf="!isLoading && searchResults.length > 0">
      <h2>Results</h2>
      <div class="results-grid">
        <div class="result-card" *ngFor="let result of rawSearchResults; let i = index">
          
        
          <!-- Catalog Entry CRUD Component -->
          <div class="details-section" style="display: flex; gap: 20px; align-items: flex-start;">
            <!-- Image on the left -->
            <div class="image-container" style="flex-shrink: 0;">
              <img [src]="getCatalogEntryImageUrl()" 
                   alt="Catalog Entry Image" 
                   style="max-width: 200px; max-height: 200px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
            </div>
            
            <!-- Attributes on the right -->
            <div class="attributes-container" style="flex: 1;">
              <div class="detail-group">
                <label>&nbsp;</label>
                <div class="interest-icons">
                  <!-- No interest recorded yet - show both icons -->
                  <ng-container *ngIf="!result.catalogEntryInterest">
                    <button class="interest-icon-btn thumbs-down" 
                            (click)="markNotInterested(result)"
                            title="Not Interested">
                      <i class="fas fa-thumbs-down"></i>
                    </button>
                    <button class="interest-icon-btn thumbs-up" 
                            (click)="markInterested(result)"
                            title="Interested">
                      <i class="fas fa-thumbs-up"></i>
                    </button>
                  </ng-container>
                  
                  <!-- Interest recorded - show appropriate icon -->
                  <ng-container *ngIf="result.catalogEntryInterest">
                    <!-- Interested (interest > 0) - show thumbs up only -->
                    <button class="interest-icon-btn thumbs-up active" 
                            *ngIf="result.catalogEntryInterest.interest && result.catalogEntryInterest.interest > 0"
                            (click)="toggleInterest(result)"
                            title="You're Interested - Click to remove">
                      <i class="fas fa-thumbs-up"></i>
                    </button>
                    <!-- Not interested (interest === 0) - show thumbs down only -->
                    <button class="interest-icon-btn thumbs-down active" 
                            *ngIf="result.catalogEntryInterest.interest === 0"
                            (click)="toggleInterest(result)"
                            title="Not Interested - Click to remove">
                      <i class="fas fa-thumbs-down"></i>
                    </button>
                  </ng-container>
                </div>
              </div>
              <div class="detail-group">
                <label>Entry Code:</label>
                <span>{{ result.entryCode }}</span>
              </div>
              <div class="detail-group">
                <label>Title:</label>
                <span>{{ result.title }}</span>
              </div>
              <div *ngIf="result.shortDescription && result.shortDescription !== result.description " class="detail-group">
                <label>Short Description:</label>
                <span>{{ result.shortDescription }}</span>
              </div>
              <div class="detail-group">
                <label>Description:</label>
                <span>{{ result.description }}</span>
              </div>
              <div *ngIf="result.notes" class="detail-group">
                <label>Notes:</label>
                <span>{{ result.notes }}</span>
              </div>
              <!-- <div class="detail-group">
                <label>Available:</label>
                <span><app-available-selector [available]="result.available" [readonly]="true"></app-available-selector></span>
              </div>
              <div class="detail-group">
                <label>URL:</label>
                <span>{{ result.url }}</span>
              </div> -->
              <!-- <div class="detail-group">
                <label>JSON:</label>
                <pre>{{ result | json }}</pre>
              </div> -->
            </div>
          </div>
          <!-- <app-catalogentry-crud 
            [id]="result.id" 
            [modeName]="'section'">
          </app-catalogentry-crud> -->
        </div>
      </div>
    </div>
      </div>
    </div>
  </div>
</div>
