<app-surveys-public-header surveyTitle="Survey Directory"></app-surveys-public-header>

<main class="surveys-dashboard-page container py-4">
  <section class="card border-0 shadow-sm">
    <div class="card-body p-4 p-md-5">
      <h1 class="h4 mb-2">Available surveys</h1>
      <p class="text-muted mb-4">Choose a survey to open and submit your responses.</p>

      <div class="list-group">
        <a
          class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
          [routerLink]="['/public/surveys/npo_job_finder']">
          <span>
            <strong>Non-profit job search assistance</strong>
            <span class="d-block text-muted small">Survey: Do you have a job for me?</span>
          </span>
          <span class="badge rounded-pill text-bg-primary">Open</span>
        </a>
      </div>
    </div>
  </section>
</main>
