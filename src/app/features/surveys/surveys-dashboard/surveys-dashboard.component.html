<app-surveys-public-header surveyTitle="Survey Directory"></app-surveys-public-header>

<main class="surveys-dashboard-page container py-4">
  <section class="card border-0 shadow-sm">
    <div class="card-body p-4 p-md-5">
      <h1 class="h4 mb-2">Available surveys</h1>
      <p class="text-muted mb-4">Choose a survey to open and submit your responses.</p>

      <div class="list-group">
        <div class="list-group-header d-none d-sm-flex">
          <span class="col-survey">Survey</span>
          <span class="col-status">Status</span>
        </div>
        <a
          *ngFor="let s of surveys"
          class="list-group-item list-group-item-action survey-row"
          [routerLink]="[s.route]">
          <span class="col-survey">
            <strong>{{ s.title }}</strong>
            <span class="d-block text-muted small">{{ s.subtitle }}</span>
          </span>
          <span class="col-status">
            <span class="badge rounded-pill" [ngClass]="s.badgeClass">{{ s.badge }}</span>
          </span>
        </a>
      </div>
    </div>
  </section>
</main>
