<app-surveys-public-header surveyTitle="Survey Directory"></app-surveys-public-header>

<main class="surveys-dashboard-page container py-4">
  <section class="card border-0 shadow-sm">
    <div class="card-body p-4 p-md-5">
      <h1 class="h4 mb-2">Available surveys</h1>
      <p class="text-muted mb-4">Choose a survey to open and submit your responses.</p>

      <div *ngIf="loading" class="alert alert-info mb-0">Loading available surveys...</div>
      <div *ngIf="error && !loading" class="alert alert-warning mb-0">{{ error }}</div>

      <div *ngIf="!loading && !error && !recentSurveys.length && !olderSurveys.length" class="text-muted mb-0">
        There are no surveys available right now.
      </div>

      <div *ngIf="!loading && recentSurveys.length" class="list-group">
        <div class="list-group-header d-none d-sm-flex">
          <span class="col-survey">Survey</span>
          <span class="col-status">Status</span>
        </div>
        <ng-container *ngFor="let s of recentSurveys">
          <ng-container *ngTemplateOutlet="surveyRow; context: { $implicit: s }"></ng-container>
        </ng-container>
      </div>

      <div *ngIf="!loading && olderSurveys.length" class="older-surveys-section">
        <h2 class="h6 section-heading">Older surveys</h2>
        <div class="list-group">
          <div class="list-group-header d-none d-sm-flex">
            <span class="col-survey">Survey</span>
            <span class="col-status">Status</span>
          </div>
          <ng-container *ngFor="let s of olderSurveys">
            <ng-container *ngTemplateOutlet="surveyRow; context: { $implicit: s }"></ng-container>
          </ng-container>
        </div>
      </div>
    </div>
  </section>
</main>

<ng-template #surveyRow let-s>
  <a
    class="list-group-item list-group-item-action survey-row"
    [routerLink]="[s.publicRoute]">
    <span class="col-survey">
      <strong>{{ s.title }}</strong>
      <span class="d-block text-muted small">{{ s.subtitle }}</span>
    </span>
    <span class="col-status">
      <span
        *ngFor="let b of s.badges"
        class="badge rounded-pill ms-1"
        [ngClass]="b.badgeClass">{{ b.label }}</span>
    </span>
  </a>
</ng-template>
