<div class="cohorts-ui-spec-link mb-3">
  <a
    *ngFor="let spec of cohortSpecs"
    [routerLink]="spec.route"
    class="btn btn-outline-success btn-sm me-2">
    <i class="fas fa-drafting-compass me-2"></i>
    Open {{ spec.label }} UI spec (MVP mock)
  </a>
  <span class="text-muted small">Static UI with doc links to cohort participant specs.</span>
</div>

<div class="d-flex justify-content-between align-items-center mb-3">
  <h5 class="mb-0">
    <i class="fas fa-users me-2"></i>
    Cohorts
  </h5>
</div>

<app-citizen-cohort-list
  [onRowClickBehavior]="cohortRowClickBehavior"
  [showingSearch]="true"
  [showingSearchHeading]="false"
  [showingGoButton]="true"
  [showingAddButton]="false"
  [showingIdCheckbox]="false"
  searchPlaceholder="search by name, organization, or leader, * for wildcard">
</app-citizen-cohort-list>
