
<app-simple-tabset *ngIf="showingTabset" [tabs]="tabs" [currentTabId]="currentTabId" ></app-simple-tabset>

<div *ngIf="currentTabId === 'resumes'">
  <app-hccluserprofile-crud [id]="currentUserProfileId" modeName="heading"></app-hccluserprofile-crud>
  
  <app-citizen-personalstatement-resume-list 
    [criteria]="getResumeCriteria()" 
    [showingSearch]="true"
    [showingSearchHeading]="false" 
    [showingGoButton]="false" 
    [showingAddButton]="false" 
    [showingIdCheckbox]="false"
    [onRowClickBehavior]="onResumeRowClickBehavior()"
    [showAllResumes]="true">
  </app-citizen-personalstatement-resume-list> 
</div>





<div *ngIf="currentTabId === 'details'">
  <app-personalstatementresume-crud [id]="resumeId" modeName="detail"></app-personalstatementresume-crud>
</div>

<div *ngIf="currentTabId === 'resume'">
  <app-dash-citizen-resume [resumeId]="resumeId"></app-dash-citizen-resume>
</div>

 
<div *ngIf="true">
  <li>CurrentId :{{currentTabId}}</li>
  <li>Id :{{id}}</li>
  <li>ChildId :{{childId}} stop_screen_share  </li>
  <li>Loading :{{loading}}</li>
  <li>ShowingTabset :{{showingTabset}}</li>
  <li>Tabs :{{tabs}}</li> 
</div>
