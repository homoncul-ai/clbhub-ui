<main class="survey-reports-page container py-4">
  <section class="card border-0 shadow-sm">
    <div class="card-body p-4 p-md-5">
      <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-2">
        <div>
          <h1 class="h4 mb-2">Survey results</h1>
          <p class="text-muted mb-0">Choose a survey to view its collected responses.</p>
        </div>
        <a class="btn btn-outline-primary btn-sm" [routerLink]="manageRoute">Manage surveys</a>
      </div>

      <div *ngIf="loading" class="alert alert-info mt-4 mb-0">Loading survey catalog...</div>
      <div *ngIf="error && !loading" class="alert alert-warning mt-4 mb-0">{{ error }}</div>

      <div *ngIf="!loading && recentSurveys.length" class="list-group mt-4">
        <div class="list-group-header d-none d-sm-flex">
          <span class="col-survey">Survey</span>
          <span class="col-status">Status</span>
        </div>
        <ng-container *ngFor="let s of recentSurveys">
          <ng-container *ngTemplateOutlet="surveyRow; context: { $implicit: s }"></ng-container>
        </ng-container>
      </div>

      <div *ngIf="!loading && olderSurveys.length" class="older-surveys-section">
        <h2 class="h6 section-heading">Older surveys</h2>
        <div class="list-group">
          <div class="list-group-header d-none d-sm-flex">
            <span class="col-survey">Survey</span>
            <span class="col-status">Status</span>
          </div>
          <ng-container *ngFor="let s of olderSurveys">
            <ng-container *ngTemplateOutlet="surveyRow; context: { $implicit: s }"></ng-container>
          </ng-container>
        </div>
      </div>
    </div>
  </section>
</main>

<ng-template #surveyRow let-s>
  <a
    class="list-group-item list-group-item-action survey-row"
    [routerLink]="[resultsBase, s.key]">
    <span class="col-survey">
      <strong>{{ s.title }}</strong>
      <span class="d-block text-muted small">{{ s.subtitle }}</span>
    </span>
    <span class="col-status">
      <span
        *ngFor="let b of s.badges"
        class="badge rounded-pill ms-1"
        [ngClass]="b.badgeClass">{{ b.label }}</span>
    </span>
  </a>
</ng-template>
