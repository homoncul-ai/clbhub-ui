<div class="modal-header text-white">
  <h5 class="modal-title">Set Password</h5>
  <span class="fa fa-times cursorPointer" (click)="onCancel()"></span>
</div>

<div class="modal-body">
  <form [formGroup]="passwordForm">
    <div class="form-symbols-text text-end">
      <small class="text-muted">
        <span class="requiredField">* </span>Required fields
      </small>
    </div>

    <div class="row">
      <div class="col-md-12">
        <div class="col-md-10 offset-md-1">

          <div class="mb-3">
            <label class="form-label" for="setPassword-password">
              <span class="requiredField">* </span>New Password
            </label>
            <input
              id="setPassword-password"
              class="form-control"
              type="password"
              autocomplete="new-password"
              formControlName="password" />
            <small class="text-muted">Minimum 8 characters.</small>
          </div>

          <div class="mb-3">
            <label class="form-label" for="setPassword-confirmPassword">
              <span class="requiredField">* </span>Confirm Password
            </label>
            <input
              id="setPassword-confirmPassword"
              class="form-control"
              type="password"
              autocomplete="new-password"
              formControlName="confirmPassword" />
          </div>

          <div *ngIf="passwordsMismatch" class="alert alert-warning mt-2">
            <i class="fas fa-exclamation-triangle me-2"></i>
            Passwords do not match.
          </div>

        </div>
      </div>
    </div>
  </form>
</div>

<div class="modal-footer">
  <button
    type="button"
    class="btn btn-sm btn-primary"
    (click)="onSubmit()"
    [disabled]="!passwordForm.valid">
    Set Password
  </button>
  <button type="button" class="btn btn-sm btn-dark" (click)="onCancel()">
    Cancel
  </button>
</div>
