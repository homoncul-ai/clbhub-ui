<div class="modal-header text-white">
  <h5 class="modal-title">Onboard Organization User</h5>
  <span class="fa fa-times cursorPointer" (click)="onCancel()"></span>
</div>

<div class="modal-body" >
  <form [formGroup]="onboardForm">
    <div class="form-symbols-text text-end" *ngIf="!isLoading">
      <small class="text-muted">
        <span class="requiredField">* </span>Required fields
      </small>
    </div>
    
    <!-- Validation Errors Section -->
    <div *ngIf="hasValidationErrors() && !isLoading" class="validation-errors-alert alert alert-warning">
      <div *ngIf="validationErrors.email" class="validation-error-item">
        <i class="fas fa-exclamation-triangle me-2"></i>
        <span>{{ validationErrors.email }}</span>
        <a *ngIf="emailExists && emailExists.id" 
           href="javascript:void(0)" 
           class="validation-error-link ms-2"
           (click)="navigateToUser(emailExists.id)">
          <i class="fas fa-external-link-alt me-1"></i>View User
        </a>
      </div>
      <div *ngIf="validationErrors.userName" class="validation-error-item">
        <i class="fas fa-exclamation-triangle me-2"></i>
        <span>{{ validationErrors.userName }}</span>
        <a *ngIf="userNameExists && userNameExists.id" 
           href="javascript:void(0)" 
           class="validation-error-link ms-2"
           (click)="navigateToUser(userNameExists.id)">
          <i class="fas fa-external-link-alt me-1"></i>View User
        </a>
      </div>
    </div>
    
    <!-- Loading indicator -->
    <div *ngIf="isLoading" class="text-center py-4">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="mt-2 text-muted">Loading organization setup data...</p>
    </div>
    
    <div class="row" *ngIf="!isLoading">
      <div class="col-md-12">
        <div class="col-md-10 offset-md-1">
          
 
          <!-- Email Address -->
          <div class="form-field-with-validation">
            <app-std-mdb-form-text 
              prefix="onboardUser" 
              name="emailAddress"
              label="Email Address"
              [required]="true"
              [error]="error"
              formControlName="emailAddress"
              (blur)="checkEmailAddress()">
            </app-std-mdb-form-text>
            <div *ngIf="checkingEmail" class="validation-spinner">
              <span class="spinner-border spinner-border-sm text-primary" role="status">
                <span class="visually-hidden">Checking...</span>
              </span>
              <small class="ms-2 text-muted">Checking email...</small>
            </div>
          </div>


                 <!-- User Name -->
                 <div class="form-field-with-validation">
                   <app-std-mdb-form-text 
                     prefix="onboardUser" 
                     name="userName"
                     label="User Name"
                     [required]="true"
                     [error]="error"
                     formControlName="userName"
                     (blur)="checkUserName()">
                   </app-std-mdb-form-text>
                   <div *ngIf="checkingUserName" class="validation-spinner">
                     <span class="spinner-border spinner-border-sm text-primary" role="status">
                       <span class="visually-hidden">Checking...</span>
                     </span>
                     <small class="ms-2 text-muted">Checking username...</small>
                   </div>
                 </div>
                 
                   <!-- Name -->
                   <app-std-mdb-form-text 
                   prefix="onboardUser" 
                   name="name"
                   label="Name"
                   [required]="true"
                   [error]="error"
                   formControlName="name">
                 </app-std-mdb-form-text>
       
       
          <!-- Work Phone -->
          <app-std-mdb-phone 
            prefix="onboardUser" 
            name="workPhone"
            label="Work Phone"
            [error]="error"
            formControlName="workPhone">
          </app-std-mdb-phone>

          <!-- Cell Phone -->
          <app-std-mdb-phone 
            prefix="onboardUser" 
            name="cellPhone"
            label="Cell Phone"
            [error]="error"
            formControlName="cellPhone">
          </app-std-mdb-phone>

          <!-- Profile Type Code should be found by calling getOrgSetupData and then 
           pulling the orgData.profileTypeMenu, and displayint the menu using 
           the app-menu-control-data-list component  -->
          <app-menu-control-data-list [menuControlDataList]="orgSetupData.profileTypeMenu" 
          [placeholder]="'Select Profile Type'" [readonly]="false" name="profileTypeCode"
          formControlName="profileTypeCode"></app-menu-control-data-list>

        </div>
      </div>
    </div>
  </form>
</div>

<div class="modal-footer">
  <button
    type="button"
    class="btn btn-sm btn-primary"
    (click)="onSubmit()"
    [disabled]="!onboardForm.valid || isLoading || hasValidationErrors()"
  >
    <span
      [ngClass]="{ 'spinner-border spinner-border-sm': isLoading }"
    >
      {{ isLoading ? 'Onboarding...' : 'Onboard User' }}
    </span>
  </button>
  <button type="button" class="btn btn-sm btn-dark" (click)="onCancel()">
    Cancel
  </button>
</div>
