<app-onboard-public-header></app-onboard-public-header>

<main class="onboard-page container py-4">
  <section class="card border-0 shadow-sm">
    <div class="card-body p-4 p-md-5">
      <h1 class="h3 mb-2">Business user onboarding</h1>
      <p class="text-muted mb-3">Complete the fields below to start your onboarding request.</p>

      <div *ngIf="loading" class="alert alert-info py-2">Loading...</div>
      <div *ngIf="messages.length" class="alert" [class.alert-danger]="true">
        <ul class="mb-0">
          <li *ngFor="let msg of messages">{{ msg.message || 'Unknown message' }}</li>
        </ul>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" *ngIf="setupComplete || !inviteId">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="firstName">First name</label>
            <input id="firstName" class="form-control" type="text" formControlName="firstName" />
          </div>
          <div class="col-md-6">
            <label class="form-label" for="lastName">Last name</label>
            <input id="lastName" class="form-control" type="text" formControlName="lastName" />
          </div>
          <div class="col-md-6">
            <label class="form-label" for="messageHandle">Message handle</label>
            <input id="messageHandle" class="form-control" type="text" formControlName="messageHandle" />
          </div>
          <div class="col-md-6">
            <label class="form-label" for="userName">Username (optional)</label>
            <input id="userName" class="form-control" type="text" formControlName="userName" />
          </div>
          <div class="col-md-6">
            <label class="form-label" for="password">Password (optional)</label>
            <input id="password" class="form-control" type="password" formControlName="password" />
          </div>
          <div class="col-md-6">
            <label class="form-label" for="inviteId">Invite ID</label>
            <input id="inviteId" class="form-control" type="text" formControlName="inviteId" />
          </div>
          <div class="col-12">
            <label class="form-label" for="acceptNotes">Notes (optional)</label>
            <textarea id="acceptNotes" class="form-control" rows="3" formControlName="acceptNotes"></textarea>
          </div>
        </div>

        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-primary" [disabled]="loading">Submit</button>
          <a class="btn btn-outline-secondary" [routerLink]="['/public/onboard']">Back</a>
        </div>
      </form>
    </div>
  </section>
</main>
