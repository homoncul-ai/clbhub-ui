<app-onboard-public-header></app-onboard-public-header>

<main class="onboard-page container py-4">
  <section class="card border-0 shadow-sm">
    <div class="card-body p-4 p-md-5">
      <h1 class="h3 mb-2">Student onboarding completion</h1>
      <p class="text-muted mb-3">Finalizing invite: <code>{{ inviteId || 'N/A' }}</code></p>

      <div *ngIf="loading" class="alert alert-info py-2">Processing onboarding completion...</div>

      <app-simple-messages-section [messagesList]="messagesList"></app-simple-messages-section>

      <div class="mt-3">
        <a
          *ngIf="canOpenApplication"
          class="btn btn-primary me-2"
          href="http://localhost:4200/student-dashboard">
          Open application
        </a>
        <a class="btn btn-outline-secondary" [routerLink]="['/public/onboard']">Back to onboarding dashboard</a>
      </div>
    </div>
  </section>
</main>
