<app-onboard-public-header></app-onboard-public-header>

<main class="onboard-page container pb-4">
  <section class="card border-0 shadow-sm">
    <div class="card-body p-4 p-md-5">
      <h1 class="h3 mb-2">{{ introTitle }}</h1>
      <p class="text-muted mb-3" *ngIf="introText">{{ introText }}</p>

      <div *ngIf="inviteNotes" class="alert alert-light border mb-3">
        <div class="fw-semibold mb-1">Message from your inviter</div>
        <div class="mb-0 whitespace-pre-wrap">{{ inviteNotes }}</div>
      </div>

      <p class="text-muted small mb-3" *ngIf="expiresText">
        Note: Invitation expires {{ expiresText }}
      </p>

      <div *ngIf="loading" class="alert alert-info py-2">Loading...</div>
      <app-simple-messages-section [messagesList]="messagesList"></app-simple-messages-section>

      <form [formGroup]="form" (ngSubmit)="submit()" *ngIf="setupComplete">
        <div class="form-check mb-3">
          <input
            id="accepted"
            class="form-check-input"
            type="checkbox"
            formControlName="accepted" />
          <label class="form-check-label" for="accepted">
            I accept this invitation
          </label>
        </div>

        <div class="mb-3">
          <label class="form-label" for="notes">Notes (optional)</label>
          <textarea
            id="notes"
            class="form-control"
            rows="3"
            formControlName="notes"
            placeholder="Add any notes for the inviting organization"></textarea>
        </div>

        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-primary" [disabled]="loading">
            Continue
          </button>
          <a class="btn btn-outline-secondary" [routerLink]="['/public/onboard']">Back</a>
        </div>
      </form>
    </div>
  </section>
</main>
