<app-onboard-public-header></app-onboard-public-header>

<main class="onboard-page container py-4">
  <section class="card shadow-sm border-0">
    <div class="card-body p-4 p-md-5">
      <h1 class="h3 mb-2">Welcome to onboarding</h1>
      <p class="text-muted mb-4">Choose the onboarding flow that matches your invitation type.</p>

      <div class="d-grid gap-3">
        <a class="btn btn-primary btn-lg" [routerLink]="['/public/onboard/student']">Student onboarding</a>
        <a class="btn btn-outline-primary btn-lg" [routerLink]="['/public/onboard/business-user']">Business user onboarding</a>
      </div>
    </div>
  </section>
</main>
