<div *ngIf="loading" class="text-center py-4">
  <div class="spinner-border" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
  <p class="mt-2">Loading signup packets...</p>
</div>

<mdb-accordion *ngIf="!loading" [multiple]="false">

  <mdb-accordion-item
    [collapsed]="isAccordionCollapsed('signuppackets')"
    (itemShow)="openAccordion('signuppackets')">
    <ng-template mdbAccordionItemHeader>
      <div class="d-flex justify-content-between align-items-center w-100 me-3">
        <span>
          <i class="fas fa-clipboard-list me-2"></i>
          Signup Packets
        </span>
        <button type="button" class="btn btn-sm btn-primary"
          (click)="openCreateModal(); $event.stopPropagation()">
          <i class="fas fa-plus me-2"></i>New
        </button>
      </div>
    </ng-template>
    <ng-template mdbAccordionItemBody>
      <app-catalogentrysignuppacket-list [criteria]="getSignupPacketCriteria()"
        [onRowClickBehavior]="onPacketRowClickBehavior()"
        [showingSearch]="false" [showingSearchHeading]="false" [showingGoButton]="false"
        [showingAddButton]="false" [showingIdCheckbox]="false">
      </app-catalogentrysignuppacket-list>

      <!-- Inline Signup Packet Panel -->
      <div *ngIf="selectedPacketId" #packetPanel class="packet-panel">
        <div class="packet-panel-header">
          <h4>{{ selectedPacketTitle }}</h4>
          <button class="close-panel-btn" (click)="closePacketPanel()" title="Close panel">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <div class="packet-panel-content">
          <app-signuppacket-tabset-ui [id]="selectedPacketId" [canEdit]="true" (saved)="onPacketSaved()"></app-signuppacket-tabset-ui>
        </div>
      </div>
    </ng-template>
  </mdb-accordion-item>

</mdb-accordion>
