<div class="modal-header text-white">
  <h5 class="modal-title">Create Team</h5>
  <span class="fa fa-times cursorPointer" (click)="onCancel()"></span>
</div>

<div class="modal-body">
  <form [formGroup]="teamForm">
    <div class="form-symbols-text text-end" *ngIf="!isLoading">
      <small class="text-muted">
        <span class="requiredField">* </span>Required fields
      </small>
    </div>
    
    <div class="row" *ngIf="!isLoading">
      <div class="col-md-12">
        <div class="col-md-10 offset-md-1">
          
          <!-- Name -->
          <app-std-mdb-form-text 
            prefix="createTeam" 
            name="name"
            label="Name"
            [required]="true"
            [error]="error"
            formControlName="name">
          </app-std-mdb-form-text>

          <!-- Business Code -->
          <app-std-mdb-form-text 
            prefix="createTeam" 
            name="businessCode"
            label="Business Code"
            [required]="true"
            [error]="error"
            formControlName="businessCode">
          </app-std-mdb-form-text>
          
          <!-- Description -->
          <app-std-mdb-form-textarea 
            prefix="createTeam" 
            name="description"
            label="Description"
            [error]="error"
            formControlName="description">
          </app-std-mdb-form-textarea>

          <!-- Team Type -->
          <div class="form-group mb-3">
            <label class="form-label">
              <span class="requiredField">* </span>Team Type
            </label>
            <app-teamtyperef-crud 
              [id]="teamTypeIdValue" 
              [modeName]="CRUD_MODES.FK_MENU">
            </app-teamtyperef-crud>
            <div *ngIf="error?.teamTypeId" class="invalid-feedback d-block">
              {{ error.teamTypeId.errorMessage }}
            </div>
          </div>

          <!-- Team Parent ID -->
          <app-std-mdb-form-text 
            prefix="createTeam" 
            name="teamParentId"
            label="Team Parent ID"
            [error]="error"
            formControlName="teamParentId">
          </app-std-mdb-form-text>

          <!-- Team Parent Entity Type -->
          <app-std-mdb-form-text 
            prefix="createTeam" 
            name="teamParentEntityType"
            label="Team Parent Entity Type"
            [error]="error"
            formControlName="teamParentEntityType">
          </app-std-mdb-form-text>

          <!-- Team Parent Name -->
          <app-std-mdb-form-text 
            prefix="createTeam" 
            name="teamParentName"
            label="Team Parent Name"
            [error]="error"
            formControlName="teamParentName">
          </app-std-mdb-form-text>

          <!-- Available -->
          <div class="form-group mb-3">
            <label class="form-label">
              <span class="requiredField">* </span>Available
            </label>
            <app-available-selector 
              [available]="availableValue"
              (availableChange)="onAvailableChange($event)">
            </app-available-selector>
            <div *ngIf="error?.available" class="invalid-feedback d-block">
              {{ error.available.errorMessage }}
            </div>
          </div>

        </div>
      </div>
    </div>
  </form>
</div>

<div class="modal-footer">
  <button
    type="button"
    class="btn btn-sm btn-primary"
    (click)="onSubmit()"
    [disabled]="!teamForm.valid || isLoading"
  >
    <span
      [ngClass]="{ 'spinner-border spinner-border-sm': isLoading }"
    >
      {{ isLoading ? 'Creating...' : 'Create Team' }}
    </span>
  </button>
  <button type="button" class="btn btn-sm btn-dark" (click)="onCancel()">
    Cancel
  </button>
</div>
