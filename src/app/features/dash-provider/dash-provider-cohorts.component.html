<div class="cohorts-ui-spec-link mb-3">
  <a routerLink="leader-ui-example" class="btn btn-outline-success btn-sm">
    <i class="fas fa-drafting-compass me-2"></i>
    Open Cohort Leader UI Spec (MVP mock)
  </a>
  <span class="text-muted small ms-2">Static UI with doc links to cohort-mvp prompt</span>
</div>

<div *ngIf="loading" class="text-center py-4">
  <div class="spinner-border" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
  <p class="mt-2">Loading cohorts...</p>
</div>

<div *ngIf="!loading">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">
      <i class="fas fa-users me-2"></i>
      Cohorts
    </h5>
    <button type="button" class="btn btn-sm btn-primary" (click)="openCreateModal()">
      <i class="fas fa-plus me-2"></i>New
    </button>
  </div>
  <app-cohort-list [criteria]="getCohortCriteria()"
    [onRowClickBehavior]="cohortRowClickBehavior"
    [showingSearch]="true" [showingSearchHeading]="false" [showingGoButton]="true"
    [showingAddButton]="false" [showingIdCheckbox]="false">
  </app-cohort-list>
</div>
