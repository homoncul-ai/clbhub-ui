<mdb-sidenav-layout>
  <!-- Common Header -->
  <nav id="main-navbar" class="navbar navbar-expand-lg navbar-light bg-primary fixed-top">
    <div class="container-fluid">
      <!-- Toggler -->
      <button class="btn shadow-0 p-0 me-3 d-block d-xxl-none" aria-controls="#sidenav-1" aria-haspopup="true" (click)="sidenav.toggle()">
        <svg xmlns="http://www.w3.org/2000/svg" width="1.5em" height="1.5em" viewBox="0 0 24 24" style="color: aliceblue;">
          <g fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="5" width="18" height="1.5" rx="0.75" />
            <rect x="3" y="11" width="15" height="1.5" rx="0.75" />
            <rect x="3" y="17" width="12" height="1.5" rx="0.75" opacity=".8" />
          </g>
        </svg>
      </button>

      <!-- Header Menu -->
      <ul class="navbar-nav me-auto d-flex flex-row align-items-center header-menu">
        <li mdbDropdown class="nav-item dropdown nav-item d-none d-lg-block dropdown nav-icon-hover-bg rounded-circle">
          <a mdbDropdownToggle id="navbarDropdownMenuLink" class="nav-link nav-icon-hover" id="drop2" href="javascript:void(0)" aria-haspopup="true" aria-expanded="false">
            <svg xmlns="http://www.w3.org/2000/svg" width="1.5em" height="1.5em" viewBox="0 0 24 24">
              <g fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M2.5 6.5a4 4 0 1 1 8 0a4 4 0 0 1-8 0Zm11 11a4 4 0 1 1 8 0a4 4 0 0 1-8 0Z" opacity=".5"></path>
                <path d="M21.5 6.5a4 4 0 1 0-8 0a4 4 0 0 0 8 0Zm-11 11a4 4 0 1 0-8 0a4 4 0 0 0 8 0Z"></path>
              </g>
            </svg>
            Dashboard
          </a>
          <div mdbDropdownMenu class="dropdown-menu dropdown-menu-nav dropdown-menu-animate-up py-0 overflow-hidden" aria-labelledby="drop2">
            <div class="row align-items-center">
              <div class="col-12">
                <div class="ps-3 pt-3">
                  <div class="border-bottom">
                    <div class="row">
                      <div class="col-12">
                        <div class="position-relative">
                          <a routerLink="/advocate-dashboard" routerLinkActive="active" class="d-flex align-items-center pb-9 position-relative">
                            <div class="bg-primary-subtle rounded-circle round-40 me-3 p-6 d-flex align-items-center justify-content-center">
                              <svg xmlns="http://www.w3.org/2000/svg" width="2em" height="2em" viewBox="0 0 24 24">
                                <g fill="none" stroke="currentColor" stroke-width="1.5">
                                  <circle cx="8" cy="8" r="3" />
                                  <path d="M8 11v3m0 0c-2 0-4 1-4 3h8c0-2-2-3-4-3Z" opacity=".5" />
                                  <path d="M14 8h4l2 2v-4l-2 2h-4zM14 8v8" />
                                </g>
                              </svg>
                            </div>
                            <div class="d-inline-block">
                              <h6 class="mb-0 bg-hover-primary">Advocate</h6>
                              <span class="fs-3 d-block text-muted">About the Advocate</span>
                            </div>
                          </a>
                          <a routerLink="/broker-dashboard" routerLinkActive="active" class="d-flex align-items-center pb-9 position-relative">
                            <div class="bg-primary-subtle rounded-circle round-40 me-3 p-6 d-flex align-items-center justify-content-center">
                              <svg xmlns="http://www.w3.org/2000/svg" width="2em" height="2em" viewBox="0 0 24 24">
                                <g fill="none" stroke="currentColor" stroke-width="1.5">
                                  <circle cx="12" cy="6" r="3" />
                                  <path d="M12 9v2m0 0c-2.5 0-5 1.5-5 4h10c0-2.5-2.5-4-5-4Z" opacity=".5" />
                                  <circle cx="5" cy="17" r="2.5" />
                                  <circle cx="19" cy="17" r="2.5" />
                                  <path d="M7.5 17h9" />
                                </g>
                              </svg>
                            </div>
                            <div class="d-inline-block">
                              <h6 class="mb-0 bg-hover-primary">Broker</h6>
                              <span class="fs-3 d-block text-muted">About the Broker</span>
                            </div>
                          </a>
                          <a routerLink="/service-provider-dashboard" routerLinkActive="active" class="d-flex align-items-center pb-9 position-relative">
                            <div class="bg-primary-subtle rounded-circle round-40 me-3 p-6 d-flex align-items-center justify-content-center">
                              <svg xmlns="http://www.w3.org/2000/svg" width="2em" height="2em" viewBox="0 0 24 24">
                                <g fill="none" stroke="currentColor" stroke-width="1.5">
                                  <circle cx="6" cy="6" r="3" opacity=".5" />
                                  <circle cx="18" cy="6" r="3" opacity=".5" />
                                  <circle cx="12" cy="14" r="4" />
                                  <path d="M8 8L10.5 11M16 8L13.5 11" />
                                </g>
                              </svg>
                            </div>
                            <div class="d-inline-block">
                              <h6 class="mb-0 bg-hover-primary">Service Provider</h6>
                              <span class="fs-3 d-block text-muted">About the Service Provider</span>
                            </div>
                          </a>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </li>
      </ul>

      <!-- Right links -->
      <ul class="navbar-nav ms-auto d-flex flex-row">
        <!-- Notification dropdown -->
        <li mdbDropdown class="nav-item dropdown">
          <a mdbDropdownToggle class="nav-link me-3 me-lg-0 dropdown-toggle hidden-arrow" id="navbarDropdownMenuLink" role="button" aria-expanded="false">
            <i class="fas fa-bell"></i>
            <span class="badge rounded-pill badge-notification bg-danger">1</span>
          </a>
          <ul mdbDropdownMenu class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdownMenuLink">
            <li><a class="dropdown-item">Some news</a></li>
            <li><a class="dropdown-item">Another news</a></li>
            <li><a class="dropdown-item">Something else here</a></li>
          </ul>
        </li>

        <!-- Language dropdown -->
        <li mdbDropdown class="nav-item dropdown">
          <a mdbDropdownToggle class="nav-link me-3 me-lg-0 dropdown-toggle hidden-arrow" id="navbarDropdown" role="button" aria-expanded="false">
            <i class="flag flag-united-kingdom m-0"></i>
          </a>
          <ul mdbDropdownMenu class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
            <li><a class="dropdown-item"><i class="flag flag-united-kingdom"></i>English<i class="fa fa-check text-success ms-2"></i></a></li>
            <li><hr class="dropdown-divider" /></li>
            <li><a class="dropdown-item"><i class="flag flag-poland"></i>Polski</a></li>
            <li><a class="dropdown-item"><i class="flag flag-china"></i>中文</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Dynamic Side Navigation based on route -->
  <mdb-sidenav #sidenav="mdbSidenav" [mode]="mode" [position]="'fixed'" [hidden]="hidden">
    <a class="d-flex justify-content-center py-4" href="#!" mdbRipple rippleColor="primary" style="min-width: 240px;">
      <img id="MDB-logo" src="imgs/vocops-4.png" width="150" alt="MDB Logo" draggable="false">
    </a>

    <!-- Dynamic Menu with MDB Treeview -->
    <div class="treeview-container">
      <div class="treeview-container p-2" #treeContainer></div>
    
    </div>


  </mdb-sidenav>

  <!-- Main Content Area -->
  <mdb-sidenav-content #sidenavContent>
    <div class="body-wrapper">
      <router-outlet></router-outlet>
    </div>
    
  </mdb-sidenav-content>
</mdb-sidenav-layout>
