    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="context-loading-text">Loading your workspace...</p>
  </div>
</div>

        <!-- User Profile Menu -->
        <li class="nav-item ms-3">
          <app-menu-control-data-list
            [menuControlDataList]="userProfileMenu"
            placeholder="Select user profile..."
            [disabled]="!userProfileMenu"
            (selectionChange)="onUserProfileChange($event)">
          </app-menu-control-data-list>
        </li>
      </ul>

      <!-- Right links -->
      <ul class="navbar-nav ms-auto d-flex flex-row">
        <!-- Language dropdown -->
        <app-language-selector [openAbove]="true"></app-language-selector>
        
        <li class="nav-item dropdown" mdbDropdown>
          <button
            class="nav-link text-white dropdown-toggle d-flex align-items-center p-0 me-2"
            type="button"
            id="dropdownMenuButton"
            aria-expanded="false"
            mdbDropdownToggle
            >
            <div class="people_avatar-container">
              <span class="people_avatar">
                <img
                  ngxGravatar
                  [email]="userDetails?.email"
                  [size]="31"
                  [fallback]="'blank'"
                  />
                </span>
                <div class="people_fallbackInitial">
                  {{ loggedInUserInitials }}
                </div>
            </div>
            {{ user }}

          </ul>
        </li>

  <!-- Dynamic Side Navigation based on route -->
  <mdb-sidenav #sidenav="mdbSidenav" [mode]="mode" [position]="'fixed'" [hidden]="hidden">
    <a class="d-flex justify-content-center py-4" href="#!" mdbRipple rippleColor="primary" style="min-width: 240px;">
      <!--       <img id="MDB-logo" src="imgs/vocops-4a.png" width="150" alt="MDB Logo" draggable="false"> --> 
      <img id="MDB-logo" src="public/imgs/clbhub-logo.png" width="150" alt="MDB Logo" draggable="false">
     </a>

    <!-- Dynamic Menu with MDB Treeview -->
    <div class="treeview-container">
      <div class="treeview-container p-2" #treeContainer></div>
    
    </div>


    <div class="side-nav-bottom-text">
      <hr class="mt-0 mb-2" />
      <mdb-sidenav-item>
        <a
          class="sidenav-link justify-content-between"
          (click)="logout()"
        >
          <span slim="false" translate>Logout</span>
          <span class="fas fa-right-from-bracket float-end"></span>
        </a>
      </mdb-sidenav-item>
    </div>
  </mdb-sidenav>

  <!-- Main Content Area -->
  <mdb-sidenav-content #sidenavContent>
 <div class="body-wrapper">
    <div class="feed-header" *ngIf="pageHeader?.title">
      <div class="header-content">
        <div class="header-icon">
          <i [class]="pageHeader.icon || 'fas fa-circle-info'"></i>
        </div>
        <div class="header-text">
          <h1 class="page-title">{{ pageHeader.title }}</h1>
          <p class="page-subtitle">{{ pageHeader.subtitle }}</p>
        </div>
      </div>
      <div class="header-actions" *ngIf="headerActions.length">
        <button
          *ngFor="let action of headerActions"
          type="button"
          class="header-action-btn"
          (click)="onHeaderAction(action.key)"
          [disabled]="action.disabled"
        >
          <i *ngIf="action.icon" [class]="action.icon" [class.fa-spin]="action.loading"></i>
          {{ action.label }}
        </button>
      </div>
    </div>

  <!-- Optional Breadcrumbs -->
<!--   <nav class="page-breadcrumbs" aria-label="breadcrumb" *ngIf="pageHeader?.breadcrumbs?.length">
    <ol class="breadcrumb mb-3">

        class="breadcrumb-item"

        <span *ngIf="last || !bc.url">{{ bc.label }}</span>
      </li>
    </ol>
  </nav> -->

  <router-outlet></router-outlet>
</div>

    
  </mdb-sidenav-content>
</mdb-sidenav-layout>
