<div
  class="consent-required-overlay"
  *ngIf="open"
  role="dialog"
  aria-modal="true"
  aria-label="Consent required">
  <div class="consent-required-dialog">
    <h5 class="consent-required-title">Agreements required</h5>
    <p class="consent-required-subtitle">
      Please review and accept the following before continuing.
    </p>

    <app-contract-section
      [consents]="consents"
      [disabled]="submitting"
      (consentSelectionChange)="onConsentSelectionChange($event)"
      (allAcceptedChange)="onAllAcceptedChange($event)">
    </app-contract-section>

    <div class="consent-required-actions">
      <button
        type="button"
        class="btn btn-primary"
        [disabled]="!allAccepted || submitting"
        (click)="onAccept()">
        <span *ngIf="submitting" class="spinner-border spinner-border-sm me-2" role="status"></span>
        Accept and continue
      </button>

      <!-- TEMP: remove before final version -->
      <button
        type="button"
        class="btn btn-outline-secondary"
        [disabled]="submitting"
        (click)="onTempDismiss()">
        Dismiss (temp)
      </button>
    </div>
  </div>
</div>
